/* Ajuste de fidelidad: tokens y layout del repositorio main @ f8d9642 */
:root{--gold:#b88a2d;--gold-strong:#9b6f18;--gold-pale:#f3e8cf;--gold-dark:#76510f;--wood:#4a3422;--olive:#6e7c3c;--olive-dark:#4f5e2a;--olive-pale:#eef2e8;--bg:#fefefd;--sidebar:#fcf9f4;--cream:#f7f1e8;--ink:#2f2924;--sub:#625b54;--muted:#8a837c;--border:#e8e2da;--red:#9e433e;--red-bg:#faeaea;--warn:#956716;--warn-bg:#fbf2df;--blue:#526d7a;--blue-bg:#edf3f5;--success:#4f6f32;--success-bg:#eef4e9;--radius:14px}
body{background:#fbfaf8;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;color:#2f2924}
.sidebar{width:272px;padding:22px;background:linear-gradient(180deg,#fdfbf7 0%,#f7f0e7 100%);gap:0;border-right:1px solid #eee8df}
.brand{min-height:112px;height:auto;padding:0 11px;align-items:flex-start;justify-content:flex-start}
.brand-logo{width:116px;height:63px;position:absolute;z-index:1;background:#fdfbf7;object-fit:contain;object-position:left center;display:block}
.brand strong.brand-fallback{display:block;font-family:Georgia,serif;font-style:normal;color:#8e6418;font-size:25px;line-height:60px;letter-spacing:-1px}
.brand span{margin-top:-2px;color:#8a837c;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.nav{gap:4px;overflow-y:auto}.nav small{margin:5px 13px 7px;padding:0;color:#a39c95;letter-spacing:.11em;font-size:9px;font-weight:700}
.nav .navitem{height:auto;min-height:44px;border:1px solid transparent;padding:0 13px;color:#4b453f;font-size:12px;font-weight:560;gap:12px;border-radius:10px}
.nav .navitem.active{background:linear-gradient(135deg,#c79a3b 0%,#a77718 100%);box-shadow:0 5px 14px rgb(184 138 45 / 18%);color:#fff}
.nav .navitem b{font-size:17px;width:18px;font-weight:450}
.sidebarfoot{margin-top:auto;padding:14px 2px;color:#8a837c;font-size:10px}
.header{height:72px;margin-left:272px;padding:0 24px;background:rgb(255 255 255 / 96%);border-bottom:1px solid #f0ece6;gap:18px}
.hsearch{width:min(480px,44vw);height:44px;border-radius:10px;background:#fff;color:#8a837c;font-size:12px;border:1px solid #e8e2da}
.aibadge{min-height:40px;border-color:#e8e2da;background:#fff;color:#8e6418}
.user{border:0}.avatar{width:36px;height:36px;background:#f6ecd5;color:#8e6418;font-family:'Cormorant Garamond',Georgia,serif;font-size:20px}
.proto-nav{margin-left:272px;padding:7px 24px;background:#f8f4ee}
.main{margin-left:272px;background:#fefefd;padding:18px 24px 28px;max-width:none}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;font-weight:600}
h1{font-size:clamp(32px,3vw,44px)}h2{font-size:22px}
.panel,.stat{border:1px solid #e8e2da;border-radius:14px;box-shadow:0 2px 8px rgb(36 23 13 / 6%);background:white}
.btn{min-height:44px;height:auto;padding:0 18px;border-radius:10px;font-weight:600}
.btn.primary{background:linear-gradient(135deg,#c79a3b 0%,#a77718 100%);color:#fff;border-color:#a77718}
.btn.sm{min-height:36px;height:36px;padding:0 12px}
.stat{padding:18px 20px;min-height:112px}.stat .ico{background:#f3e8cf}.stat strong{font-family:'Cormorant Garamond',Georgia,serif}
.panelhead{padding:18px 20px 14px}.panelbody{padding:20px}
.field input,.field select,.field textarea,.filter{min-height:44px;border:1px solid #d7cfc5;border-radius:10px}

/* v0.7 · Adaptación funcional fiel al sistema visual del repositorio */
:root{--fm-sidebar-width:272px;--fm-header-height:72px}
.sidebar{width:272px}.header,.main{margin-left:272px}
.brand .brand-logo{position:relative;z-index:2;object-fit:contain;background:transparent}
.brand strong.brand-fallback{margin-top:-61px;height:63px;display:flex;align-items:center;z-index:1}
.header .bell{font-size:21px;display:grid;place-items:center}
.header .bell:after{content:' ';position:absolute;width:6px;height:6px;border:1px solid #9b6f18;border-radius:50%}
.main{min-height:calc(100vh - 72px)}
.nav .navitem{min-height:44px}
.brand span{position:relative;z-index:3}
.module-nav{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:2px 0 23px;padding-bottom:15px;border-bottom:1px solid var(--border)}
.module-tabs{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.module-tab{position:relative;border:1px solid transparent;border-radius:10px;min-height:44px;background:transparent;padding:0 16px;color:var(--sub);font-size:12px;font-weight:700}
.module-tab.active{background:var(--gold-pale);border-color:#e5d6b8;color:var(--gold-dark)}
.module-tab b{font-size:10px;padding:3px 6px;background:#fff;border-radius:7px;color:var(--warn);margin-left:4px}
.actions-head{display:flex;align-items:center;gap:8px}
.select-row{position:relative;cursor:pointer}
.select-row.has-issue{box-shadow:inset 5px 0 0 var(--red);background:linear-gradient(90deg,#fcf0ef,#fff 23%)}
.select-row.has-issue td:first-child{padding-left:15px}
.row-issue{color:var(--red);font-weight:800;font-size:11px;display:inline-flex;align-items:center;gap:5px}
.issue-pill{border:1px solid #e7b9b7;border-radius:8px;background:#f9e7e7;padding:5px 7px}
.statrow.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.toggletabs{display:flex;gap:7px;margin:12px 0}
.datatable-wrap{width:100%;overflow:auto}
.searchbar{display:flex;gap:8px;align-items:center;padding:14px 18px;flex-wrap:wrap}
.searchbar input,.searchbar select{background:#fff;border:1px solid var(--border);border-radius:10px;min-height:44px;padding:8px 12px;font-size:12px;color:var(--sub)}
.searchbar input{flex:1;min-width:210px}
.tabcount{display:inline-flex;margin-left:7px;background:#fff;min-width:20px;height:20px;align-items:center;justify-content:center;border:1px solid #e5decf;border-radius:99px;color:var(--gold-dark);font-size:10px}
.crumb{margin-bottom:10px;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
.crumb button{border:0;background:transparent;padding:2px;color:var(--gold-dark);font-weight:700}
.slimnote{font-size:11px;color:var(--muted);line-height:1.5}
.route-links{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.notif-pop{position:fixed;top:65px;right:158px;width:min(390px,calc(100vw - 24px));z-index:30;border:1px solid var(--border);border-radius:14px;background:#fff;box-shadow:0 18px 40px #24170d2d;overflow:hidden}
.notif-item{padding:15px;border-top:1px solid var(--border);font-size:12px}
.notif-item strong{display:block;margin-bottom:3px}.notif-item small{display:block}
.notif-item.issue{background:#fcf0ef;border-left:4px solid var(--red)}
.notif-item.ok{border-left:4px solid var(--success)}
.notif-item.todo{border-left:4px solid var(--gold)}
.viewlink{border:0;background:transparent;color:var(--gold-dark);font-size:12px;cursor:pointer;font-weight:700;text-align:left;padding:0}
.admin-list td:first-child{text-align:center}
.approval-form{display:grid;gap:16px}.approval-form .kv{font-size:11px}
.owner-tag{display:inline-flex;gap:8px;align-items:center;background:var(--cream);border:1px solid #e9dfcf;border-radius:99px;padding:6px 10px;font-weight:700;font-size:11px}
.sheet-tool{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tasks-layout{display:grid;grid-template-columns:minmax(340px,1fr) 550px;gap:16px;align-items:start}
.task-card{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--border);border-radius:11px;margin-bottom:10px;background:#fff}
.task-card:hover{border-color:#dabd7e;background:#fffdfa}
.task-card .fill{flex:1}
.task-card .actions{display:flex;gap:6px;flex-wrap:wrap}
.labelpage{width:100%;min-height:515px;padding:19px 14px;max-width:550px}
.shiplabel{height:140px;margin-bottom:13px;grid-template-columns:25% 53% 22%;padding:9px}
.shiplabel .left strong{font-size:9px!important;line-height:1.12;text-align:center;display:block;min-height:21px}
.shiplabel .left img{width:76px!important;height:76px!important;margin-top:4px!important;max-width:95%}
.shiplabel .label-main{min-width:0;padding:0 9px;display:flex;flex-direction:column;justify-content:space-around}
.shiplabel .label-main strong{font-size:12px!important;line-height:1.12;border-bottom:1px solid #ddd;padding-bottom:2px;display:block}
.shiplabel .label-main p{font-size:9px;line-height:1.13;border-bottom:1px solid #eee;overflow-wrap:anywhere;padding:2px 0}
.shiplabel .label-side{border-left:1px solid #c9c9c9;min-width:0;padding-left:9px;display:flex;flex-direction:column;justify-content:space-around;gap:2px}
.shiplabel .label-side strong{font-size:9.5px}
.shiplabel .label-side p{font-size:9px;line-height:1.15;overflow-wrap:anywhere}
.task-card .fill strong,.task-card .fill small{display:block;margin-bottom:3px}
.shiplabel .left{justify-content:flex-start}
.label-demo-hint{font-size:10px;color:var(--muted);margin:9px 0}
.shiplabel img{image-rendering:pixelated}
.seller-wrap{min-height:100vh;background:#fffefa}
.seller-top{min-height:95px;background:#fff;border-bottom:1px solid var(--border);padding:15px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.seller-top .seller-logo{color:#926a1c;font-family:Georgia,serif;font-size:26px;font-style:italic}
.seller-top .seller-label{font-size:12px;font-weight:700;margin-left:14px}
.seller-main{max-width:1400px;margin:0 auto;padding:23px}
.seller-nav{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:20px;overflow:auto}
.seller-nav button{white-space:nowrap;border:1px solid var(--border);background:#fff;border-radius:10px;padding:11px 15px;font-size:12px;font-weight:700;color:var(--sub)}
.seller-nav button.active{background:var(--gold-pale);border-color:#d1af67;color:var(--gold-dark)}
.qr-page{min-height:100vh;background:#fbfaf8;display:flex;flex-direction:column;align-items:center;gap:0}
.qr-top{height:73px;background:#fff;border-bottom:1px solid var(--border);width:100%;display:flex;justify-content:center;align-items:center;color:var(--gold-dark);font:italic 29px Georgia,serif}
.qr-content{width:min(100%,520px);padding:23px 22px 38px}
.qr-content h1{font-size:35px;margin:6px 0 10px}
.qr-content h2{font-size:25px}
.qr-card{border:1px solid var(--border);background:#fff;border-radius:14px;padding:17px;margin:14px 0;box-shadow:0 2px 8px #24170d08}
.qr-card p{font-size:12px;line-height:1.55;color:var(--sub)}
.qr-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qr-choice{min-height:160px;padding:18px 10px;background:#fff;border:1px solid var(--border);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;font-weight:750;color:var(--ink)}
.qr-choice .big{font-size:40px;color:var(--gold-dark)}
.qr-choice span:not(.big){font-size:11px;color:var(--muted);font-weight:400}
.qr-choice:hover{border-color:var(--gold);background:#fffcf5}
.qr-content .btn{font-size:13px}
.qr-content .btn.full{margin-bottom:9px}
.qr-content .mockmap{height:235px}
.gps-ask{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:var(--sub);padding:9px 11px;background:#faf8f3;border:1px solid var(--border);border-radius:10px;margin:12px 0}
.gps-ask a{color:var(--gold-dark)}
.gps-granted{font-size:11px;color:var(--success);margin:10px 0}
.qr-timeline{display:flex;gap:4px;margin:14px 0}
.qr-timeline span{height:5px;background:#eee9e2;border-radius:9px;flex:1}.qr-timeline span.done{background:#8a9d69}.qr-timeline span.live{background:var(--gold)}
.feedback{margin-top:12px}
.feedback select,.feedback textarea{width:100%;margin-top:7px;padding:11px;border:1px solid #d7cfc5;border-radius:10px;background:white;min-height:44px}
.feedback textarea{min-height:74px}
.back-action{padding:10px 0;background:none;border:0;color:var(--gold-dark);font-weight:700;font-size:12px}
.demo-watermark{text-align:center;color:var(--muted);font-size:10px;margin-top:22px}
.mute-button{border:0;background:transparent;color:var(--muted);font-size:11px;padding:6px 2px}
.qr-mini{font-size:11px;color:var(--muted)}

function showDetail(id){selectedShipment=id||'ENV-1045';notifyOpen=false;navigate('detalle')}

function tablero(){const a=selectedTab==='todos'?data:data.filter(d=>d.group===selectedTab);return `<div class="titlebar"><div><div class="over">MÓDULO 11 · LOGÍSTICA</div><h1>Gestión de envíos</h1><div class="subtitle">Supervisá pedidos pendientes, entregas en curso y el historial. Las alertas críticas llegan a Notificaciones.</div></div></div><div class="statrow three"><div class="stat"><div class="ico">▣</div><div><span>Pendientes</span><strong>4</strong><small>En preparación, listos y por revisar</small></div></div><div class="stat blue"><div class="ico">⇢</div><div><span>En camino</span><strong>1</strong><small>Incluye los tramos por repositorio</small></div></div><div class="stat green"><div class="ico">✓</div><div><span>Realizados</span><strong>1</strong><small>Entregas completadas</small></div></div></div><div class="panel"><div class="panelhead"><div><h2>Envíos registrados</h2><p>Tocá cualquier pedido para abrir su detalle, estado y seguimiento.</p></div><button class="btn sm" onclick="showToast('Exportación solo representada en el prototipo')">↓ Exportar historial</button></div><div class="tabs">${[['pendientes','Pendientes'],['camino','En camino'],['realizados','Realizados'],['todos','Todos']].map(([id,n])=>`<button class="tab ${selectedTab===id?'active':''}" onclick="selectedTab='${id}';render()">${n}</button>`).join('')}</div><div class="searchbar"><input aria-label="Buscar envíos" placeholder="⌕ Buscar código, cliente, teléfono o dirección..." oninput="filterRows(this.value)"><select aria-label="Filtrar por transporte"><option>Todos los transportes</option><option>Uber</option><option>Repositorio</option><option>Manual</option></select><select aria-label="Origen"><option>Todas las ubicaciones</option><option>Local Valle</option><option>Depósito Infal</option></select></div><div class="datatable-wrap"><table class="table admin-list"><thead><tr><th>!</th><th>Envío / Venta</th><th>Cliente</th><th>Dirección / Zona</th><th>Transporte</th><th>Estado</th><th>Preparador</th><th>Hora</th><th></th></tr></thead><tbody id="shipment-rows">${rows(a)}</tbody></table></div></div><p class="footer-note">Las incidencias se marcan en rojo dentro del pedido; el aviso general aparece en la campana, no como un cartel sobre el tablero. Datos ficticios.</p>`}
function filterRows(s){const q=s.toLocaleLowerCase('es');document.querySelectorAll('#shipment-rows tr').forEach(x=>x.hidden=!x.textContent.toLocaleLowerCase('es').includes(q))}
function solicitudes(){return `<div class="titlebar"><div><div class="over">GESTIÓN DE ENVÍOS / AUTORIZACIÓN</div><h1>Solicitudes del vendedor</h1><div class="subtitle">Aprobá las solicitudes y elegí la ubicación real antes de descontar stock.</div></div><span class="chip warning">2 solicitudes pendientes</span></div><div class="grid2" style="grid-template-columns:350px minmax(0,1fr)"><div class="panel"><div class="panelhead"><div><h2>Por aprobar</h2><p>Ventas registradas desde el Panel Vendedor</p></div></div><div class="panelbody"><button class="subcard" style="width:100%;text-align:left;cursor:pointer;background:${requestID==='ENV-1044'?'#fffbf0':'white'}" onclick="requestID='ENV-1044';render()"><span class="chip warning">Pendiente de aprobación</span><div class="sp8"></div><strong>#ENV-1044 · Julia Fernández</strong><small>Venta PV-2029 · Local Valle · 2 productos</small><small>13:10 · Cobro registrado</small></button><button class="subcard" style="width:100%;text-align:left;cursor:pointer;background:${requestID==='ENV-1048'?'#fffbf0':'white'};margin-top:12px" onclick="requestID='ENV-1048';render()"><span class="chip warning">Pendiente de aprobación</span><div class="sp8"></div><strong>#ENV-1048 · Franco López</strong><small>Venta PV-2032 · Local Valle · 1 producto</small><small>12:40 · Cobro registrado</small></button></div></div><div class="panel"><div class="panelhead"><div><h2>Revisión · #${requestID}</h2><p>El local que realizó la venta se conserva en sus métricas.</p></div><span class="chip warning">Aún sin descuento de stock</span></div><div class="panelbody approval-form"><div class="grid2"><div><div class="minor">Venta registrada en</div><div class="warehouse"><strong>Local Valle</strong><div class="slimnote">Atribución comercial: no se modifica.</div></div></div><div><div class="minor">Origen físico aprobado para despacho</div><div class="field"><select aria-label="Origen del stock"><option>Depósito Infal</option><option>Local Valle</option><option>Otro depósito habilitado</option></select><span class="hint">Solo este origen podrá descontarse.</span></div></div></div><div class="banner warn"><span>⚠ El inventario registrado del depósito puede ser insuficiente. Revisá existencias antes de autorizar una excepción auditada.</span></div><div class="fieldrow"><div class="field"><label>Tipo de transporte</label><select><option>Repositorio</option><option>Uber</option><option>Manual</option></select></div><div class="field"><label>Asignar preparadores</label><select><option>Agustín y Lorena</option><option>Lorena</option><option>Agustín</option></select></div></div><div class="grid2"><div class="kv"><span class="k">Cliente</span><strong>${requestID==='ENV-1044'?'Julia Fernández':'Franco López'}</strong></div><div class="kv"><span class="k">Dirección</span><strong>Paraguay 1420 · CABA</strong></div></div><div class="separator"></div><div class="buttons"><button class="btn" onclick="showToast('Vista previa del documento de venta; demo')">Ver venta</button><button class="btn primary" onclick="approvalDone=true;showToast('DEMO: solicitud aprobada. Descontaría stock una sola vez del origen elegido.')">✓ Aprobar y asignar</button></div><p class="footer-note">En producción, la aprobación será transaccional e idempotente. Esta maqueta no escribe en Firestore.</p></div></div></div>`}
function labelHTML(d,i){const q=labelsQR[i%labelsQR.length];return `<div class="shiplabel"><div class="left"><strong style="font-size:10px">${d.area}</strong><img style="width:74px;height:74px;margin-top:9px" src="${q}" alt="QR de demostración"/></div><div class="label-main"><strong style="font-size:14px">${d.name}</strong><p>Tel: ${d.phone}</p><p>Dirección: ${d.address}</p><p>Observaciones: ${d.id==='ENV-1042'?'Entregar después de las 17 h.':'No hay observaciones'}</p><p>Pedido: ${d.id==='ENV-1042'?'1 bidón 5 L':d.id==='ENV-1043'?'6 botellas Blend 500 cc':'1 caja surtida'}</p></div><div class="label-side"><strong>16/10/2026</strong><p>Prepara: ${d.who}</p><p>${d.kind}</p><p>FLOR MÍA</p></div></div>`}
function labelSheet(){const items=[data[0],data[1],data[3]].filter(d=>taskSelection.has(d.id));return `<div class="labelpage">${items.length?items.map((x,i)=>labelHTML(x,i)).join(''):'<div class="banner warn">Seleccioná al menos una etiqueta</div>'}<p class="label-demo-hint">Vista previa · QR DEMO sin autorización · El generador real ajustará tamaños y saltos de página según cantidad.</p></div>`}
function taskPanel(viewSeller=false){const tasks=[data[0],data[1],data[3]].map(x=>({...x,who:viewSeller?'Lorena':'Agustín'}));return `<div class="titlebar"><div><div class="over">${viewSeller?'PANEL VENDEDOR':'GESTIÓN DE ENVÍOS / EQUIPO INTERNO'}</div><h1>Mis preparaciones y etiquetas</h1><div class="subtitle">Pedidos asignados a tu usuario. Seleccioná uno o varios para reunir etiquetas en una sola hoja A4.</div></div><span class="owner-tag">◯ ${viewSeller?'Lorena · Vendedora':'Agustín · Administrador'}</span></div><div class="tasks-layout"><div class="panel print-hide"><div class="panelhead"><div><h2>Envíos asignados</h2><p>Preparación y etiquetas individuales o agrupadas.</p></div><span class="chip gold">3 asignados</span></div><div class="panelbody"><div class="sheet-tool marginbottom"><button class="btn sm" onclick="selectAllTasks()">Seleccionar todos</button><span class="slimnote" id="count-label">${taskSelection.size} seleccionados</span></div>${tasks.map(x=>`<div class="task-card"><input type="checkbox" class="selection" ${taskSelection.has(x.id)?'checked':''} onchange="toggleTask('${x.id}',this.checked)"><div class="fill"><strong>#${x.id} · ${x.name}</strong><small>${x.address} · ${x.area}</small><div style="margin-top:7px">${chip(x)} <span class="chip">${x.kind}</span></div></div><div class="actions"><button class="btn sm" onclick="selectedShipment='${x.id}';navigate('qr-inicio')">Ver QR</button></div></div>`).join('')}<div class="separator"></div><div class="buttons"><button class="btn primary" onclick="printLabels()">▣ Imprimir selección en A4</button><button class="btn" onclick="selectedShipment='ENV-1042';navigate('qr-interno')">✓ Confirmar preparación por QR</button></div><p class="footer-note">No permite asignarse otros envíos sin autorización. La vista es equivalente para vendedores y administradores autorizados.</p></div></div><div class="panel label-print-area"><div class="panelhead print-hide"><div><h2>Vista previa de impresión</h2><p>Un archivo PDF para las etiquetas seleccionadas.</p></div><span class="chip gold">A4</span></div><div class="panelbody">${labelSheet()}</div></div></div>`}
function toggleTask(id,checked){if(checked)taskSelection.add(id);else taskSelection.delete(id);render()}
function selectAllTasks(){taskSelection=new Set(['ENV-1042','ENV-1043','ENV-1045']);render()}
function printLabels(){if(!taskSelection.size){showToast('Elegí al menos una etiqueta');return}window.print()}
function detalle(){const d=data.find(x=>x.id===selectedShipment)||data[3];const isRepo=d.kind==='Repositorio';return `<div class="crumb"><button onclick="navigate('tablero')">Gestión de envíos</button> › <strong>#${d.id}</strong></div><div class="titlebar"><div><div class="over">DETALLE DEL ENVÍO · SEGUIMIENTO</div><h1>${d.name} <span style="font:12px Inter,system-ui;vertical-align:middle">${chip(d)}</span></h1><div class="subtitle">Venta ${d.sale} · ${d.kind} · Origen: ${d.origin} · Destino: ${d.address}</div></div><div class="buttons"><button class="btn" onclick="navigate('qr-inicio')">▦ Abrir QR</button><button class="btn" onclick="navigate('cliente')">◉ Vista pública</button><button class="btn primary" onclick="copyTracking()">⌁ Copiar enlace cliente</button></div></div>${d.issue?`<div class="banner red marginbottom"><strong>⚠ Incidencia activa:</strong> Dirección incorrecta. Administrador debe revisar el envío. <button class="btn sm alert" onclick="showToast('DEMO: corregir dirección con trazabilidad')">Revisar</button></div>`:''}<div class="progressstrip"><span class="done">✓ Venta registrada</span><span class="done">✓ Preparado</span><span class="${isRepo?'done':'live'}">${isRepo?'✓ Retiro al repositorio':'⇢ Retiro'}</span>${isRepo?'<span class="done">✓ Recibido en repositorio</span>':''}<span class="${isRepo?'live':''}">⇢ ${isRepo?'Distribución al cliente':'En camino'}</span><span>Entrega confirmada</span></div><div class="threecol" style="grid-template-columns:290px minmax(0,1fr) 280px"><div class="panel"><div class="panelhead"><h2>Datos del pedido</h2></div><div class="panelbody"><div class="kv" style="grid-template-columns:100px 1fr"><span class="k">Cliente</span><strong>${d.name}</strong></div><div class="kv" style="grid-template-columns:100px 1fr"><span class="k">Teléfono</span><strong>${d.phone}</strong></div><div class="kv" style="grid-template-columns:100px 1fr"><span class="k">Dirección</span><strong>${d.address}</strong></div><div class="kv" style="grid-template-columns:100px 1fr"><span class="k">Zona</span><strong>${d.area}</strong></div><div class="kv" style="grid-template-columns:100px 1fr"><span class="k">Transporte</span><strong>${d.kind}</strong></div><div class="kv" style="grid-template-columns:100px 1fr"><span class="k">Prepara</span><strong>${d.who}</strong></div><div class="separator"></div><strong>Pedido</strong><p class="subtitle">1 × Aceite de oliva Blend 2 L<br>2 × Almendras Guara 500 g</p><div class="separator"></div><div class="banner ${d.stock==='descontado'?'green':'warn'}">${d.stock==='descontado'?'✓ Stock descontado en Venta Rápida. El envío no vuelve a descontarlo.':'◷ Solicitud del vendedor: descontar al aprobar el origen.'}</div><div class="sp15"></div><button class="btn full" onclick="showToast('DEMO: editar domicilio/pin con historial de cambios')">✎ Revisar dirección y pin</button></div></div><div class="panel"><div class="panelhead"><div><h2>Seguimiento del recorrido</h2><p>${isRepo?'Tramo 2 · Repositorio → Cliente':'Origen → Cliente'} · última ubicación permitida</p></div></div><div class="panelbody">${mapSvg()}<div class="sp15"></div><div class="grid2"><div class="metricline"><div><strong>13:47</strong><span>Última posición</span></div><div><strong>±24 m</strong><span>Precisión GPS</span></div></div><div class="panel" style="padding:13px"><strong>Estado de GPS</strong><p class="slimnote">Ubicación activa solo durante distribución autorizada.</p><div class="route-links"><button class="btn sm" onclick="navigate('cliente')">Ver como cliente</button></div></div></div></div></div><div class="panel"><div class="panelhead"><div><h2>Eventos</h2><p>Traza de cada cambio de estado</p></div></div><div class="panelbody"><div class="timeline"><div class="step done"><strong>Venta registrada</strong><small>12:54 · Venta Rápida</small></div><div class="step done"><strong>Pedido preparado</strong><small>13:02 · Lorena</small></div><div class="step done"><strong>Retirado de ${d.origin}</strong><small>13:14 · Repartidor</small></div>${isRepo?'<div class="step done"><strong>Recibido en repositorio</strong><small>13:29 · Escaneo del QR</small></div>':''}<div class="step live"><strong>${isRepo?'Salió del repositorio':'En camino'}</strong><small>13:42 · GPS de reparto</small></div><div class="step"><strong>Entrega confirmada</strong><small>Pendiente</small></div></div><div class="separator"></div><button class="btn full" onclick="navigate('qr-inicio')">▦ Simular escaneo del QR</button></div></div></div>`}
function copyTracking(){const link='https://appintegralflormia.netlify.app/seguimiento/DEMO-NO-OPERATIVO';if(navigator.clipboard?.writeText){navigator.clipboard.writeText(link).then(()=>showToast('Enlace de demostración copiado; no funciona como seguimiento real')).catch(()=>showToast(link))}else showToast('Enlace de demo: no operativo')}
function vendedor(){return `<div class="seller-wrap"><div class="seller-top"><div><span class="seller-logo">Flor Mía</span><span class="seller-label">Panel Vendedor · Local Valle</span></div><div class="buttons"><span class="chip success">● Online</span><button class="btn" onclick="sellerNotifyOpen=!sellerNotifyOpen;render()">♧ Notificaciones (2)</button><button class="btn" onclick="navigate('tablero')">Volver a Gestión de Envíos</button></div></div><div class="seller-main"><div class="seller-nav">${['Nueva venta','Mis ventas','Pendientes','Stock','Precios','Mis preparaciones y etiquetas'].map(x=>`<button class="${x==='Mis preparaciones y etiquetas'?'active':''}" onclick="xDemo('${x}')">${x}${x==='Mis preparaciones y etiquetas'?' · 3':''}</button>`).join('')}</div>${sellerNotifyOpen?`<div class="banner blue marginbottom"><strong>Notificaciones del vendedor</strong> Tenés 2 nuevos pedidos asignados para preparar. <button class="btn sm" onclick="sellerNotifyOpen=false;render()">Cerrar</button></div>`:''}${taskPanel(true)}</div></div>`}
function xDemo(n){if(n==='Mis preparaciones y etiquetas')return;showToast('Vista de '+n+' existente en Panel Vendedor; fuera de esta maqueta.')}
function qrShell(content){return `<div class="qr-page"><div class="qr-top">Flor Mía</div><main class="qr-content">${content}<p class="demo-watermark">PROTOTIPO VISUAL · datos y QR de demostración · no realiza operaciones reales</p></main></div>`}
function qrInicio(){return qrShell(`<div class="over">CÓDIGO DEL ENVÍO · ${txt(selectedShipment)}</div><h1>¿Cómo querés continuar?</h1><p class="subtitle">Seleccioná el tipo de acceso. Cada usuario tendrá únicamente las acciones que le correspondan.</p><div class="qr-card"><strong>Pedido #${txt(selectedShipment)}</strong><p>Flor Mía · Acceso al estado y operación del envío mediante QR.</p></div><div class="qr-grid"><button class="qr-choice" onclick="navigate('qr-interno')"><span class="big">♙</span>Soy personal de Flor Mía<span>Ingreso con mi cuenta de la empresa</span></button><button class="qr-choice" onclick="navigate('qr-repartidor')"><span class="big">⇢</span>Soy repartidor<span>Acceso temporal autorizado para este envío</span></button></div><p class="slimnote" style="margin-top:18px">Un QR por envío. El enlace por sí solo no habilita cambios de estado: el personal requiere autenticación; el repartidor, autorización limitada.</p><div class="route-links"><button class="back-action" onclick="navigate('detalle')">← Volver al detalle del envío</button></div>`)}
function qrInterno(){return qrShell(`<button class="back-action" onclick="navigate('qr-inicio')">← Elegir otro acceso</button><div class="over">USUARIO FLOR MÍA · PREPARACIÓN</div><h1>Preparar pedido</h1><span class="chip warning">En preparación</span><div class="qr-card"><p class="slimnote">Sesión simulada: Lorena · Vendedora. En producción, se requiere una sesión Firebase autorizada.</p><div class="separator"></div><strong>Envío #${txt(selectedShipment)}</strong><p>Cliente: Lucía Pérez<br>Destino: Moldes 950, CABA (Colegiales)</p><div class="separator"></div><strong>Productos a preparar</strong><p>1 × Aceite de oliva Blend 2 L<br>2 × Almendras Guara 500 g</p></div>${internalReady?`<div class="banner green marginbottom">✓ Pedido preparado. Se avisará al responsable de envíos y a los administradores.</div>`:`<button class="btn primary full" onclick="internalReady=true;showToast('DEMO: preparación confirmada');render()">✓ Pedido preparado y listo para retirar</button>`}<button class="btn alert full" onclick="activeModal=activeModal==='interno'?'':'interno';render()">⚠ No puedo preparar el pedido</button>${activeModal==='interno'?`<div class="qr-card feedback"><strong>Reportar problema de preparación</strong><label class="field" style="margin-top:12px">Motivo<select id="int-reason"><option>Falta stock suficiente</option><option>No hay bolsas o cajas disponibles</option><option>Producto faltante o dañado</option><option>Otro problema</option></select></label><label class="field" style="margin-top:12px">Observaciones (opcional)<textarea id="int-note" placeholder="Explicá brevemente lo ocurrido"></textarea></label><button class="btn alert full" style="margin-top:12px" onclick="reportIssue('interno')">Enviar incidencia al administrador</button></div>`:''}<p class="slimnote">Esta pantalla no permite descontar stock ni reasignar depósitos. Solo confirma la preparación o informa un problema.</p>`)}
function courierAction(){const origin=data.find(x=>x.id===selectedShipment)?.origin||'Local Valle';const first=origin.includes('Depósito')?'Confirmar retiro del depósito':'Confirmar retiro del local';if(courierKind==='repositorio')return [first,'Confirmar llegada al repositorio','Confirmar salida del repositorio','Confirmar entregado'][Math.min(courierStep,3)];return [first,'Confirmar entregado'][Math.min(courierStep,1)]}
function courierProgress(){const n=courierKind==='repositorio'?4:2;return Array.from({length:n},(_,i)=>`<span class="${i<courierStep?'done':i===courierStep?'live':''}"></span>`).join('')}
function courierAdvance(){const n=courierKind==='repositorio'?4:2;if(courierStep>=n-1 && !gpsConsent){showToast('En producción se comprobará proximidad GPS, con excepción supervisada. Activá ubicación primero.');return}courierStep++;if(courierStep>=n){showToast('DEMO: entrega confirmada; se detendría GPS y avisaría a administradores');}render()}
function qrRepartidor(){let n=courierKind==='repositorio'?4:2,done=courierStep>=n,finalStep=courierStep>=n-1,shouldGPS=courierKind!=='repositorio'?courierStep>=1:courierStep>=2;const dest='Mitre%20250%2C%20San%20Martin%2C%20Buenos%20Aires';return qrShell(`<button class="back-action" onclick="navigate('qr-inicio')">← Elegir otro acceso</button><div class="over">PORTAL DE REPARTO · ${courierKind==='repositorio'?'REPOSITORIO':'ENTREGA DIRECTA'}</div><h1>Envío #${txt(selectedShipment)}</h1><span class="chip ${done?'success':'info'}">${done?'Entregado':courierKind==='repositorio'&&courierStep<2?'Tramo hacia el repositorio':'En curso'}</span><div class="qr-card"><strong>Entrega para Mariano Ruiz</strong><p>Mitre 250, San Martín · Buenos Aires (San Martín)</p><p>Teléfono del destinatario: 11 0000-1118</p><p>Origen: Local Valle · Transporte: ${courierKind==='repositorio'?'Repositorio':'Uber / Manual'}</p></div><div class="qr-card"><div class="minor">Etapa del envío</div><div class="qr-timeline">${courierProgress()}</div><strong>${done?'Entrega completada':courierAction()}</strong><p>${courierKind==='repositorio'?'Paso '+Math.min(courierStep+1,n)+' de '+n:'Etapa '+Math.min(courierStep+1,n)+' de '+n}. Solo verás la próxima acción permitida.</p></div>${shouldGPS&&!done&&!gpsConsent?`<div class="gps-ask"><span>⌖ Para compartir tu recorrido, permití ubicación.</span><button class="btn sm ghost" onclick="gpsConsent=true;render()">Habilitar</button></div>`:shouldGPS&&!done&&gpsConsent?'<div class="gps-granted">✓ Ubicación autorizada (solo simulación)</div>':''}${courierKind==='repositorio'&&courierStep<2?'<div class="smallmap" style="height:132px;display:block;padding:25px;text-align:center"><strong>Tramo al repositorio</strong><p class="slimnote">GPS no requerido en este primer tramo. El administrador debe configurar la dirección del repositorio para habilitar las indicaciones.</p></div>':mapSvg()}${courierKind==='repositorio'&&courierStep<2?'<button class="btn full" disabled style="margin-top:12px">⌖ Cómo llegar al repositorio · dirección pendiente</button>':`<a class="btn full" style="margin-top:12px" href="https://www.google.com/maps/dir/?api=1&destination=${dest}" target="_blank" rel="noopener noreferrer">↗ Cómo llegar con Google Maps</a>`}<div class="sp15"></div>${done?`<div class="banner green">✓ Envío finalizado. Compartir ubicación detenido.</div>`:`<button class="btn primary full" onclick="courierAdvance()">✓ ${courierAction()}</button><button class="btn alert full" onclick="activeModal=activeModal==='repartidor'?'':'repartidor';render()">⚠ Tengo un problema</button>`}${activeModal==='repartidor'&&!done?`<div class="qr-card feedback"><strong>Reportar un problema</strong><label class="field" style="margin-top:12px">Motivo<select id="courier-reason"><option>Cliente ausente</option><option>Dirección incorrecta</option><option>Problemas de acceso o timbre</option><option>Avería del transporte</option><option>Pedido dañado</option><option>Otro problema</option></select></label><label class="field" style="margin-top:12px">Información adicional<textarea id="courier-note" placeholder="¿Qué pasó?"></textarea></label><button class="btn alert full" style="margin-top:12px" onclick="reportIssue('repartidor')">Enviar alerta crítica</button></div>`:''}<p class="slimnote" style="margin-top:12px">QR operativo individual y autorización temporal. Una confirmación por etapa; no se pide dos veces la entrega.</p><div class="route-links"><button class="mute-button" onclick="courierKind=courierKind==='repositorio'?'directo':'repositorio';courierStep=0;gpsConsent=false;render()">Solo para probar diseño: alternar Repositorio / Uber</button></div>`)}
function reportIssue(role){const field=document.getElementById(role==='interno'?'int-reason':'courier-reason');const msg=field?.value||'Incidencia';issued.unshift({id:selectedShipment,reason:msg,role});activeModal='';showToast('DEMO: incidente registrado visualmente para Notificaciones');render()}
function qrCliente(){return qrShell(`<div class="over">ENLACE PÚBLICO · SOLO LECTURA</div><h1>Tu pedido está en camino</h1><p class="subtitle">Podés consultar el estado y el recorrido de tu envío.</p><div class="qr-card"><strong>Pedido #ENV-1045</strong><p>Estado: En distribución desde el repositorio hacia el domicilio de entrega.</p><div class="progressstrip" style="margin-bottom:0"><span class="done">Preparado</span><span class="done">Despachado</span><span class="live">En camino</span><span>Entregado</span></div></div>${mapSvg()}<div class="qr-card"><strong>Información del envío</strong><p>Entrega: Buenos Aires (San Martín)<br>Última ubicación disponible: 13:47</p><p>El mapa muestra únicamente la información permitida para tu pedido.</p></div><p class="slimnote">Compartir el enlace automáticamente por WhatsApp será una integración futura. Esta vista no muestra datos internos del vendedor ni permite operar el envío.</p><button class="back-action" onclick="navigate('detalle')">← Volver a la demostración</button>`)}
function ventaExterna(){activeModal='venta';showToast('Abriendo Venta Rápida existente en otra pestaña (no crea ninguna venta).');window.open('https://appintegralflormia.netlify.app/gestion/quick-sales','_blank','noopener,noreferrer')}
function navigate(v){if(v==='venta-externa'){ventaExterna();return}VIEW=v;notifyOpen=false;window.location.hash=VIEW;render()}
function render(){const admin=['tablero','solicitudes','preparaciones','detalle'].includes(VIEW);const target=({tablero,solicitudes,preparaciones:()=>taskPanel(false),detalle,vendedor,'qr-inicio':qrInicio,'qr-interno':qrInterno,'qr-repartidor':qrRepartidor,cliente:qrCliente})[VIEW]||tablero;
 document.title=(admin?'Gestión de envíos':VIEW==='vendedor'?'Panel Vendedor':'Envío por QR')+' · Flor Mía · Prototipo v0.7';
 document.getElementById('root').innerHTML=admin?`<div class="layout">${shell()}<main class="main" id="main">${moduleNavigation()}${target()}</main></div>`:target();
 window.scrollTo(0,0);
}
VIEW=location.hash.slice(1)||'tablero';if(!['tablero','solicitudes','preparaciones','detalle','vendedor','qr-inicio','qr-interno','qr-repartidor','cliente'].includes(VIEW))VIEW='tablero';render();
</script></body></html>
