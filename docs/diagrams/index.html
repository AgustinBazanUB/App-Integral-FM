<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa Maestro · Flor Mía</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f1e9;
      --ink: #282b24;
      --muted: #555d50;
      --olive: #404d33;
      --stroke: #d8d4c8;
      --surface: #fffefa;
      --focus: #1d4ed8;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); }
    button, a { font: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    h1, h2, p { margin: 0; }
    a { color: var(--olive); text-underline-offset: 3px; }
    .header {
      display: flex; justify-content: space-between; align-items: center; gap: 16px;
      padding: 15px clamp(18px, 4vw, 44px); background: var(--surface);
      border-bottom: 1px solid var(--stroke);
    }
    .identity { display: flex; align-items: center; gap: 12px; }
    .identity h1 { font: 500 clamp(24px, 3vw, 31px)/1.05 Georgia, serif; }
    .identity span { color: var(--muted); font-size: 13px; }
    .cut { color: var(--muted); text-align: right; font-size: 13px; white-space: nowrap; }
    .cut code { color: var(--ink); }
    .layout { display: grid; grid-template-columns: 254px minmax(0, 1fr); min-height: calc(100dvh - 64px); }
    aside { border-right: 1px solid var(--stroke); padding: 28px 16px 18px 24px; }
    nav h2 {
      color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .12em;
      margin: 0 10px 8px;
    }
    nav ul { list-style: none; padding: 0; margin: 0 0 23px; }
    nav li + li { margin-top: 2px; }
    nav a {
      display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 6px;
      text-decoration: none; font-size: 13px; font-weight: 600;
    }
    nav a:hover { background: #ebe9df; }
    nav a[aria-current="page"] { color: white; background: var(--olive); }
    .nav-id { font: 500 11px/1 ui-monospace, Consolas, monospace; min-width: 19px; }
    main { padding: 23px clamp(16px, 3vw, 34px) 18px; min-width: 0; display: flex; flex-direction: column; }
    .heading { display: flex; justify-content: space-between; gap: 12px 20px; align-items: end; flex-wrap: wrap; }
    .title { font: 500 clamp(25px, 4vw, 38px)/1.08 Georgia, serif; letter-spacing: -.025em; }
    .description { color: var(--muted); font-size: 14px; line-height: 1.4; margin-top: 6px; }
    .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .actions button, .actions a, .zoom button {
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid var(--stroke); border-radius: 6px; min-height: 38px;
      padding: 6px 11px; background: var(--surface); color: var(--ink); text-decoration: none;
      font-size: 12px; font-weight: 650; white-space: nowrap;
    }
    .actions .copy { color: white; background: var(--olive); border-color: var(--olive); }
    .actions button:hover, .actions a:hover, .zoom button:hover { filter: brightness(.94); }
    .status { font-size: 12px; min-height: 20px; padding-top: 3px; color: var(--muted); }
    .frame {
      flex: 1; min-height: 330px; position: relative; border: 1px solid var(--stroke);
      border-radius: 9px; overflow: hidden; background: #fcfbf8;
    }
    .viewport {
      min-height: 330px; height: 100%; position: absolute; inset: 0; overflow: hidden; touch-action: none;
      background-image: radial-gradient(#d2d4cc 1px, transparent 1px);
      background-size: 18px 18px; cursor: grab; user-select: none;
    }
    .viewport:focus-visible { outline-offset: -3px; }
    .viewport.dragging { cursor: grabbing; }
    .viewport img { position: absolute; left: 0; top: 0; transform-origin: top left; pointer-events: none; }
    .zoom {
      position: absolute; right: 12px; bottom: 12px; display: flex; gap: 4px;
      padding: 4px; background: var(--surface); border: 1px solid var(--stroke); border-radius: 8px;
    }
    .zoom button { min-width: 34px; min-height: 33px; border: none; }
    .zoom button:disabled { color: #74776f; cursor: default; }
    .zoom .percent { min-width: 56px; font-variant-numeric: tabular-nums; }
    .legend { margin: 12px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 16px; list-style: none; }
    .legend li { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
    .swatch { width: 11px; height: 11px; background: var(--swatch); border-radius: 2px; }
    .swatch.dashed { background: transparent; border: 2px dashed var(--swatch); }
    .manual { margin-top: 12px; }
    .manual label { display: block; font-size: 13px; }
    .manual textarea { width: 100%; margin-top: 6px; background: white; color: var(--ink); }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 204px minmax(0, 1fr); }
      aside { padding-left: 12px; padding-right: 10px; }
    }
    @media (max-width: 690px) {
      .header { padding: 13px 16px; }
      .identity span { display: none; }
      .layout { display: block; }
      aside { border: 0; border-bottom: 1px solid var(--stroke); padding: 11px 12px 8px; }
      nav { display: flex; align-items: center; gap: 7px; overflow-x: auto; padding: 3px 2px; }
      nav h2 { margin: 0 3px; font-size: 10px; }
      nav ul { display: flex; gap: 3px; margin: 0; }
      nav li + li { margin-top: 0; }
      nav a { white-space: nowrap; padding: 8px; }
      main { padding-top: 16px; }
      .frame { min-height: max(370px, 56dvh); }
      .description { font-size: 13px; }
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark; --paper: #232820; --ink: #f5f2e8; --muted: #c2cab9;
        --olive: #c8d5aa; --stroke: #53594e; --surface: #2d342a; --focus: #b7cdfd;
      }
      nav a:hover { background: #394238; }
      nav a[aria-current="page"], .actions .copy { color: #20271d; }
      .viewport { background-color: #353c32; background-image: radial-gradient(#666f60 1px, transparent 1px); }
      .manual textarea { background: var(--surface); }
    }
  </style>
</head>

" ry=\"7\" fill=\"#B45309\" stroke=\"#92400E\" stroke-width=\"2px\" />\n  \u003cellipse cx=\"1126.0539999999996\" cy=\"382.75\" rx=\"156.57799999999997\" ry=\"7\" fill=\"#B45309\" stroke=\"#92400E\" stroke-width=\"2px\" />\n  \u003ctext x=\"1126.0539999999996\" y=\"401.2\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"500\" fill=\"#FFFFFF\" dy=\"4.55\">Firebase de pruebas · aislamiento del preview\u003c/text>\n\u003c/g>\n\u003c/svg>","width":1322.6319999999996,"height":466.65}],"palette":[{"id":"actor","color":"#1E293B","dashed":false},{"id":"integral","color":"#1D4ED8","dashed":false},{"id":"ecommerce","color":"#047857","dashed":false},{"id":"shared","color":"#6D28D9","dashed":false},{"id":"db","color":"#B45309","dashed":false},{"id":"external","color":"#475569","dashed":true},{"id":"debt","color":"#B91C1C","dashed":true}]}</script>
  <script>
    const { diagrams, palette } = JSON.parse(document.querySelector('#diagram-data').textContent);
    const byId = new Map(diagrams.map(item => [item.id, item]));
    const title = document.querySelector('#diagram-title');
    const description = document.querySelector('#diagram-description');
    const viewport = document.querySelector('#viewport');
    const image = document.querySelector('#diagram');
    const fit = document.querySelector('#fit');
    const zoomIn = document.querySelector('#in');
    const zoomOut = document.querySelector('#out');
    const status = document.querySelector('#status');
    const manual = document.querySelector('#manual');
    const source = document.querySelector('#source');
    const captions = {
      actor: 'Actor', integral: 'App Integral FM', ecommerce: 'E-Commerce', shared: 'Capa transversal',
      db: 'Persistencia', external: 'Servicio externo', debt: 'Brecha o flujo incompleto',
    };

    let current = null;
    let zoom = 1;
    let panX = 0;
    let panY = 0;
    let drag = null;

    for (const item of palette) {
      const row = document.createElement('li');
      const swatch = document.createElement('span');
      swatch.className = item.dashed ? 'swatch dashed' : 'swatch';
      swatch.style.setProperty('--swatch', item.color);
      row.append(swatch, captions[item.id]);
      document.querySelector('#legend').append(row);
    }

    diagrams.forEach((item, index) => {
      const row = document.createElement('li');
      const anchor = document.createElement('a');
      const marker = document.createElement('span');
      anchor.href = '#' + item.id;
      marker.className = 'nav-id';
      marker.textContent = index < 3 ? '0' + String.fromCharCode(65 + index) : 'D' + (index - 2);
      anchor.append(marker, item.title);
      row.append(anchor);
      document.querySelector(index < 3 ? '#macro' : '#domains').append(row);
    });

    function paint() {
      if (!current) return;
      const base = Math.min(
        (viewport.clientWidth - 24) / current.width,
        (viewport.clientHeight - 24) / current.height,
      );
      const scale = Math.max(0.01, base) * zoom;
      const x = (viewport.clientWidth - current.width * scale) / 2 + panX;
      const y = (viewport.clientHeight - current.height * scale) / 2 + panY;
      image.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + scale + ')';
      fit.textContent = Math.round(zoom * 100) + '%';
      zoomIn.disabled = zoom >= 5;
      zoomOut.disabled = zoom <= 0.6;
    }

    function reset() {
      zoom = 1;
      panX = 0;
      panY = 0;
      paint();
    }

    function select() {
      current = byId.get(location.hash.slice(1)) || diagrams[0];
      title.textContent = current.title;
      description.textContent = current.description;
      document.querySelectorAll('nav a').forEach(anchor => {
        if (anchor.hash === '#' + current.id) anchor.setAttribute('aria-current', 'page');
        else anchor.removeAttribute('aria-current');
      });
      image.alt = current.title;
      image.width = Math.ceil(current.width);
      image.height = Math.ceil(current.height);
      image.src = 'data:image/svg+xml,' + encodeURIComponent(current.svg);
      status.textContent = '';
      manual.hidden = true;
      reset();
    }

    function magnify(multiplier) {
      zoom = Math.min(5, Math.max(0.6, zoom * multiplier));
      paint();
    }

    window.addEventListener('hashchange', select);
    new ResizeObserver(paint).observe(viewport);
    zoomIn.addEventListener('click', () => magnify(1.25));
    zoomOut.addEventListener('click', () => magnify(0.8));
    fit.addEventListener('click', reset);
    viewport.addEventListener('dblclick', reset);
    viewport.addEventListener('pointerdown', event => {
      if (!event.isPrimary || event.button !== 0) return;
      drag = { id: event.pointerId, x: event.clientX, y: event.clientY };
      viewport.setPointerCapture(event.pointerId);
      viewport.classList.add('dragging');
    });
    viewport.addEventListener('pointermove', event => {
      if (drag?.id !== event.pointerId) return;
      panX += event.clientX - drag.x;
      panY += event.clientY - drag.y;
      drag.x = event.clientX;
      drag.y = event.clientY;
      paint();
    });
    viewport.addEventListener('lostpointercapture', () => {
      drag = null;
      viewport.classList.remove('dragging');
    });
    viewport.addEventListener('keydown', event => {
      switch (event.key) {
        case 'ArrowLeft': panX -= 40; break;
        case 'ArrowRight': panX += 40; break;
        case 'ArrowUp': panY -= 40; break;
        case 'ArrowDown': panY += 40; break;
        case '+': case '=': magnify(1.25); break;
        case '-': magnify(0.8); break;
        case '0': reset(); break;
        default: return;
      }
      event.preventDefault();
      paint();
    });
    document.querySelector('#copy').addEventListener('click', async () => {
      const selected = current;
      try {
        await navigator.clipboard.writeText(selected.source);
        if (current === selected) status.textContent = 'Código Mermaid copiado.';
      } catch {
        if (current !== selected) return;
        source.value = selected.source;
        manual.hidden = false;
        source.select();
        if (document.execCommand('copy')) {
          manual.hidden = true;
          document.querySelector('#copy').focus();
          status.textContent = 'Código Mermaid copiado.';
        } else {
          status.textContent = 'Seleccioná el código y copialo con Ctrl+C.';
        }
      }
    });
    select();
  </script>
