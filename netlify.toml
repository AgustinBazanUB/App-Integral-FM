[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_FIREBASE_API_KEY = "AIzaSyD-GEqaTJZKXyKa7fUBbXa0Cigit7qZyio"
  VITE_FIREBASE_AUTH_DOMAIN = "fm-stock-y-venta.firebaseapp.com"
  VITE_FIREBASE_PROJECT_ID = "fm-stock-y-venta"
  VITE_FIREBASE_STORAGE_BUCKET = "fm-stock-y-venta.firebasestorage.app"
  VITE_FIREBASE_MESSAGING_SENDER_ID = "334694189931"
  VITE_FIREBASE_APP_ID = "1:334694189931:web:6f75a7f73e2eacd3675a2e"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
