[build]
  command = "npm run build:ecommerce && node deploy/ecommerce/prepare-preview.mjs"
  publish = "dist/ecommerce"

[build.environment]
  NODE_VERSION = "20"

# El sitio público no empaqueta las Functions administrativas del repositorio.
[functions]
  directory = "deploy/ecommerce/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://ventasonline.payway.com.ar/static/v2.6.4/decidir.js https://h.online-metrix.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://h.online-metrix.net; font-src 'self' data:; connect-src 'self' https://h.online-metrix.net https://developers.decidir.com https://developers-ventasonline.payway.com.ar; frame-src https://h.online-metrix.net; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Robots-Tag = "noindex, nofollow"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
