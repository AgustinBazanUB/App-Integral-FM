name: Netlify Production — PR 36 merge

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy production to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "NETLIFY_AUTH_TOKEN is not configured in GitHub Actions secrets."
            exit 2
          fi
          SITE="${NETLIFY_SITE_ID:-appintegralflormia}"
          npx --yes netlify-cli deploy \
            --prod \
            --dir=dist \
            --site="$SITE" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --message="PR #36 merged to main" \
            --json
