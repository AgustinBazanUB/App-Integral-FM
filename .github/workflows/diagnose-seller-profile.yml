name: Diagnose Seller Profile Shape

on:
  push:
    branches:
      - ops/firestore-rules-preview
    paths:
      - .github/workflows/diagnose-seller-profile.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare credentials
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_APP_INTEGRAL_FM: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_APP_INTEGRAL_FM }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_APP_INTEGRAL_FM"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_APP_INTEGRAL_FM" > "$RUNNER_TEMP/firebase-service-account.json"
      - name: Inspect non-sensitive profile shape
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          npm install --no-save --ignore-scripts firebase-admin@13.4.0
          node --input-type=module <<'NODE'
          import admin from 'firebase-admin';
          admin.initializeApp({ credential: admin.credential.applicationDefault(), projectId: 'app-integral-fm' });
          const snap = await admin.firestore().collection('users').limit(100).get();
          const rows = snap.docs.map((doc) => {
            const data = doc.data();
            const value = data.allowedLocationIds;
            return {
              idPrefix: doc.id.slice(0, 6),
              role: data.role || null,
              active: data.active === true,
              canAccessAdmin: data.canAccessAdmin === true,
              allowedLocationIdsType: Array.isArray(value) ? 'array' : value === null ? 'null' : typeof value,
              allowedLocationIdsCount: Array.isArray(value) ? value.length : null,
            };
          });
          console.log(JSON.stringify(rows, null, 2));
          NODE
