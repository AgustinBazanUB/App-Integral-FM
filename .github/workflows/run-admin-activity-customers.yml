name: Run Admin Activity Customers

on:
  push:
    branches:
      - agent/rendimiento-vendedor-clientes
    paths:
      - .github/workflows/run-admin-activity-customers.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rendimiento-vendedor-clientes
      - name: Extract patch script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/apply-admin-activity-customers.yml').read_text(encoding='utf-8')
          start = src.index('      - name: Apply staged improvements\n')
          start = src.index('        run: |\n', start) + len('        run: |\n')
          end = src.index('      - name: Run tests\n', start)
          block = src[start:end]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply_stage.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python /tmp/apply_stage.py
      - name: Test
        run: npm test
      - name: Rules test
        run: npx firebase-tools@14.12.0 emulators:exec --only firestore --project demo-flor-mia-integral "npm run test:rules"
      - name: Build
        run: npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git diff --cached --quiet && exit 0
          git commit -m "Mejorar administrador actividad y clientes fidelizados"
          git push origin HEAD:agent/rendimiento-vendedor-clientes
