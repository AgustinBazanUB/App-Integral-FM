name: Stage 5 light implementation verification

on:
  push:
    branches: ["feature/meta-ads-creative-workspace"]

permissions:
  contents: write

jobs:
  stage5-light:
    if: ${{ !contains(github.event.head_commit.message, '[stage5-light-verified]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/meta-ads-creative-workspace
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply Stage 5 integration patch
        run: node scripts/apply-stage5-integration.mjs

      - name: Install dependencies
        run: npm ci

      - name: Stage 5 focused tests only
        run: node --test tests/meta-ads-creative-workspace-domain.test.mjs tests/meta-ads-drive-contract.test.mjs

      - name: Syntax checks for new backend/domain files
        run: |
          node --check src/gestion/marketing/metaAds/creativeWorkspaceDomain.js
          node --check src/gestion/marketing/metaAds/googleDriveService.js
          node --check netlify/functions/_lib/serverFirestore.mjs
          node --check netlify/functions/_lib/googleDrive.mjs
          node --check netlify/functions/google-drive.mjs
          node --check netlify/functions/google-drive-callback.mjs
          git diff --check

      - name: Production build
        run: npm run build

      - name: Remove temporary implementation helpers
        run: |
          rm -f scripts/apply-stage5-integration.mjs
          rm -f .github/workflows/stage5-light-verify.yml

      - name: Commit verified Stage 5 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat(meta-ads): integrate creative workspace and Drive [stage5-light-verified]"
            git push origin HEAD:feature/meta-ads-creative-workspace
          fi
