name: Stage 3 apply and verify
on:
  push:
    branches: [feature/meta-ads-theory-engine]
permissions:
  contents: write
jobs:
  apply-verify:
    if: contains(github.event.head_commit.message, '[stage3-apply]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/meta-ads-theory-engine
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Prepare deterministic patches
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/gestion/permissions.js'); s=p.read_text()
          old='  "metaAdsArchiveProject",\n];'
          new='  "metaAdsArchiveProject",\n  "metaAdsManageKnowledge",\n  "metaAdsManageTheory",\n];'
          if s.count(old)!=2: raise SystemExit(f'permissions patterns: {s.count(old)}')
          s=s.replace(old,new,1).replace(old,new,1); p.write_text(s)
          h=Path('scripts/apply-stage3-patches.mjs'); lines=h.read_text().splitlines()
          lines=[line for line in lines if not line.startswith('await patch("src/gestion/permissions.js"')]
          h.write_text('\n'.join(lines)+'\n')
          PY
      - name: Apply additive Stage 3 patches
        run: node scripts/apply-stage3-patches.mjs
      - name: Harden Theory schema and Firestore validation
        run: |
          python - <<'PY'
          from pathlib import Path

          schema=Path('src/gestion/marketing/metaAds/theorySchema.js')
          s=schema.read_text()
          s=s.replace('requirementCount: 80, ruleCount: 80','requirementCount: 20, ruleCount: 20')
          s=s.replace('.slice(0,80)', '.slice(0,20)')
          s=s.replace('maxItems:80', 'maxItems:20')
          schema.write_text(s)

          service=Path('src/gestion/marketing/metaAds/theoryService.js')
          s=service.read_text().replace('gpt-5.4-mini','gpt-5.6-luna')
          service.write_text(s)

          rules_path=Path('firestore.rules')
          rules=rules_path.read_text()
          start=rules.index('    function validTheoryConfig(c) {')
          end=rules.index('    function validTheoryParent(d) {', start)
          creative='\n        && '.join([f'(v.size() < {i+1} || validCreativeRequirement(v[{i}]))' for i in range(20)])
          generic='\n        && '.join([f'(v.size() < {i+1} || validTheoryRule(v[{i}]))' for i in range(20)])
          validations='\n        && '.join([f'(v.size() < {i+1} || validValidationRule(v[{i}]))' for i in range(20)])
          strong=f'''    function validDurationValue(v) {{
              return v == null || (v is number && v >= 0 && v <= 900);
            }}
            function validTheoryDuration(d) {{
              return d is map
                && d.keys().hasAll(["minSeconds","idealSeconds","maxSeconds"])
                && d.keys().hasOnly(["minSeconds","idealSeconds","maxSeconds"])
                && validDurationValue(d.minSeconds)
                && validDurationValue(d.idealSeconds)
                && validDurationValue(d.maxSeconds)
                && (d.minSeconds == null || d.idealSeconds == null || d.minSeconds <= d.idealSeconds)
                && (d.idealSeconds == null || d.maxSeconds == null || d.idealSeconds <= d.maxSeconds)
                && (d.minSeconds == null || d.maxSeconds == null || d.minSeconds <= d.maxSeconds);
            }}
            function validCreativeRequirement(r) {{
              return r is map
                && r.keys().hasAll(["key","label","required","minCount","recommendedCount","maxCount","duration","instructions"])
                && r.keys().hasOnly(["key","label","required","minCount","recommendedCount","maxCount","duration","instructions"])
                && r.key is string && r.key.size() > 0 && r.key.size() <= 64
                && r.label is string && r.label.size() > 0 && r.label.size() <= 160
                && r.required is bool
                && r.minCount is int && r.minCount >= 0 && r.minCount <= 100
                && r.recommendedCount is int && r.recommendedCount >= 0 && r.recommendedCount <= 100
                && r.maxCount is int && r.maxCount >= 0 && r.maxCount <= 100
                && r.minCount <= r.recommendedCount && r.recommendedCount <= r.maxCount
                && validTheoryDuration(r.duration)
                && r.instructions is string && r.instructions.size() <= 4000;
            }}
            function validCreativeRequirements(v) {{
              return v is list && v.size() <= 20
                && {creative};
            }}
            function validTheoryRule(r) {{
              return r is map
                && r.keys().hasAll(["key","label","instructions","appliesToObjectives","appliesToPlatforms"])
                && r.keys().hasOnly(["key","label","instructions","appliesToObjectives","appliesToPlatforms"])
                && r.key is string && r.key.size() > 0 && r.key.size() <= 64
                && r.label is string && r.label.size() > 0 && r.label.size() <= 160
                && r.instructions is string && r.instructions.size() <= 4000
                && r.appliesToObjectives is list && r.appliesToObjectives.size() <= 30
                && r.appliesToPlatforms is list && r.appliesToPlatforms.size() <= 20;
            }}
            function validTheoryRuleList(v) {{
              return v is list && v.size() <= 20
                && {generic};
            }}
            function validValidationRule(r) {{
              return r is map
                && r.keys().hasAll(["key","label","severity","instructions"])
                && r.keys().hasOnly(["key","label","severity","instructions"])
                && r.key is string && r.key.size() > 0 && r.key.size() <= 64
                && r.label is string && r.label.size() > 0 && r.label.size() <= 160
                && r.severity in ["info","warning","error"]
                && r.instructions is string && r.instructions.size() <= 4000;
            }}
            function validValidationRules(v) {{
              return v is list && v.size() <= 20
                && {validations};
            }}
            function validQuestionPolicy(q) {{
              return q is map
                && q.keys().hasAll(["mode","instructions","requiredFields"])
                && q.keys().hasOnly(["mode","instructions","requiredFields"])
                && q.mode in ["minimal","guided","custom"]
                && q.instructions is string && q.instructions.size() <= 4000
                && q.requiredFields is list && q.requiredFields.size() <= 50;
            }}
            function validTheoryMetadata(m) {{
              return m is map
                && m.keys().hasAll(["compilerNotes"])
                && m.keys().hasOnly(["compilerNotes"])
                && m.compilerNotes is string && m.compilerNotes.size() <= 4000;
            }}
            function validTheoryConfig(c) {{
              return c is map
                && c.keys().hasAll(["schemaVersion","platform","name","description","campaignRules","creativeRequirements","validationRules","questionPolicy","testingRules","recommendationRules","metadata"])
                && c.keys().hasOnly(["schemaVersion","platform","name","description","campaignRules","creativeRequirements","validationRules","questionPolicy","testingRules","recommendationRules","metadata"])
                && c.schemaVersion == 1
                && c.platform is string && c.platform.size() > 0 && c.platform.size() <= 64
                && c.name is string && c.name.size() > 0 && c.name.size() <= 120
                && c.description is string && c.description.size() <= 4000
                && validTheoryRuleList(c.campaignRules)
                && validCreativeRequirements(c.creativeRequirements)
                && validValidationRules(c.validationRules)
                && validQuestionPolicy(c.questionPolicy)
                && validTheoryRuleList(c.testingRules)
                && validTheoryRuleList(c.recommendationRules)
                && validTheoryMetadata(c.metadata);
            }}
'''
          rules_path.write_text(rules[:start]+strong+rules[end:])
          PY
      - name: Update regression and security tests
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/meta-ads-foundations.test.mjs'); s=p.read_text()
          s=s.replace('const [app, preload] = await Promise.all([\n    read("src/gestion/ManagementApp.jsx"),\n    read("src/gestion/routePreload.js"),\n  ]);','const [app, preload, hub] = await Promise.all([\n    read("src/gestion/ManagementApp.jsx"),\n    read("src/gestion/routePreload.js"),\n    read("src/gestion/pages/MetaAdsHubPage.jsx"),\n  ]);')
          s=s.replace('assert.match(preload, /MetaAdsPage/);','assert.match(preload, /MetaAdsHubPage/);\n  assert.match(hub, /MetaAdsPage/);')
          p.write_text(s)

          p=Path('tests/firestore.meta-ads-theory.rules.mjs'); s=p.read_text()
          extra='''\ntest("Theory Rules rechazan cantidades, duraciones y claves anidadas inválidas",async()=>{const db=environment.authenticatedContext("marketing-theory").firestore(),theoryId="theory-invalid-nested";await assertSucceeds(setDoc(doc(db,"metaAdTheories",theoryId),{...parent("marketing-theory"),name:"Nested invalid"}));const ref=doc(db,"metaAdTheories",theoryId,"versions","v1");await assertSucceeds(setDoc(ref,{...version("marketing-theory"),theoryId}));await assertSucceeds(updateDoc(ref,{status:"compiling",updatedBy:"marketing-theory",updatedByName:"Marketing",updatedAt:now()}));const negative=config();negative.creativeRequirements[0].minCount=-1;await assertFails(updateDoc(ref,{status:"review",config:negative,compilerMetadata:{provider:"openai",operation:"theory_compile",model:"test",responseId:null,inputTokens:1,outputTokens:1,totalTokens:2,actualCostUsd:null,compilerVersion:"1"},compileError:null,updatedBy:"marketing-theory",updatedByName:"Marketing",updatedAt:now()}));const badDuration=config();badDuration.creativeRequirements[0].duration={minSeconds:7,idealSeconds:5,maxSeconds:4};await assertFails(updateDoc(ref,{status:"review",config:badDuration,compilerMetadata:{provider:"openai",operation:"theory_compile",model:"test",responseId:null,inputTokens:1,outputTokens:1,totalTokens:2,actualCostUsd:null,compilerVersion:"1"},compileError:null,updatedBy:"marketing-theory",updatedByName:"Marketing",updatedAt:now()}));const poisoned=config();poisoned.creativeRequirements[0].html="<script>";await assertFails(updateDoc(ref,{status:"review",config:poisoned,compilerMetadata:{provider:"openai",operation:"theory_compile",model:"test",responseId:null,inputTokens:1,outputTokens:1,totalTokens:2,actualCostUsd:null,compilerVersion:"1"},compileError:null,updatedBy:"marketing-theory",updatedByName:"Marketing",updatedAt:now()}));});\n'''
          if 'Theory Rules rechazan cantidades' not in s: s += extra
          p.write_text(s)
          PY
      - name: Fix Theory review flow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/gestion/pages/MetaAdsTheoriesView.jsx'); s=p.read_text()
          old='const approve=async()=>{setBusy(true);try{const config=parseJson();if(!config)throw new Error("TheoryConfig inválido.");if(JSON.stringify(config)!==JSON.stringify(version.config)){await saveTheoryVersion(profile,theory,version,{sourceText,config,sourceType:version.sourceMetadata?.sourceType||"editor",sourceName:version.sourceMetadata?.sourceName||"Editor interno"});version=await getTheoryVersion(profile,theory.id,version.id);}await approveTheoryVersion(profile,theory,version);setMessage("Versión aprobada. La activación sigue siendo una acción separada.");await reload(version.id);}catch(error){setMessage(theoryFriendlyError(error));}finally{setBusy(false);}};'
          new='const approve=async()=>{setBusy(true);try{const config=parseJson();if(!config)throw new Error("TheoryConfig inválido.");let current=version;if(JSON.stringify(config)!==JSON.stringify(version.config)){await saveTheoryVersion(profile,theory,version,{sourceText,config,sourceType:version.sourceMetadata?.sourceType||"editor",sourceName:version.sourceMetadata?.sourceName||"Editor interno"});current=await getTheoryVersion(profile,theory.id,version.id);}await approveTheoryVersion(profile,theory,current);setMessage("Versión aprobada. La activación sigue siendo una acción separada.");await reload(current.id);}catch(error){setMessage(theoryFriendlyError(error));}finally{setBusy(false);}};'
          if old not in s: raise SystemExit('approve flow pattern not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Application and domain tests
        run: npm test
      - name: Firestore Rules Emulator tests
        run: npx firebase-tools@14.12.0 emulators:exec --only firestore --project demo-flor-mia-stage3 "npm run test:rules"
      - name: Production build
        run: npm run build
      - name: Remove temporary implementation artifacts
        run: |
          rm -f stage3-payload.b64 stage3-payload-00.b64
          rm -f scripts/apply-stage3-patches.mjs
          rm -f .github/workflows/stage3-bootstrap.yml
          rm -f .github/workflows/stage3-apply.yml
      - name: Commit verified Stage 3 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(meta-ads): integrate knowledge base and theory engine"
          git push origin HEAD:feature/meta-ads-theory-engine
          git push origin --delete tmp-noop tmp-stage3-safe || true
