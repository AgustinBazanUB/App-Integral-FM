name: Apply WhatsApp Marketing Stage

on:
  push:
    branches:
      - agent/rendimiento-vendedor-clientes
    paths:
      - .github/workflows/apply-whatsapp-marketing-stage.yml

permissions:
  contents: write

jobs:
  apply-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rendimiento-vendedor-clientes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply implementation
        run: |
          python scripts/apply_whatsapp_marketing_stage.py
          python scripts/fix_whatsapp_marketing_stage.py
      - name: Install Excel dependency and refresh lockfile
        run: npm install --save-exact read-excel-file@9.3.4
      - name: Unit and integration tests
        run: npm test
      - name: Firestore rules tests
        run: npx firebase-tools@14.12.0 emulators:exec --only firestore --project demo-flor-mia-integral "npm run test:rules"
      - name: Production build
        run: npm run build
      - name: Commit validated implementation
        run: |
          git config user.name "AgustinBazanUB"
          git config user.email "167490338+AgustinBazanUB@users.noreply.github.com"
          git rm scripts/apply_whatsapp_marketing_stage.py scripts/fix_whatsapp_marketing_stage.py .github/workflows/apply-whatsapp-marketing-stage.yml
          git add -A
          git commit -m "[skip netlify] Implementar campañas masivas de WhatsApp en Marketing"
          git push origin HEAD:agent/rendimiento-vendedor-clientes
