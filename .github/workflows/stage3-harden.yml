name: Stage 3 harden
on:
  push:
    branches:
      - feature/meta-ads-theory-engine
permissions:
  contents: write
jobs:
  harden:
    if: contains(github.event.head_commit.message, '[stage3-harden]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/meta-ads-theory-engine
      - name: Harden Theory Rules and tests
        run: python scripts/harden-stage3-rules.py
      - name: Remove temporary hardening files
        run: |
          rm scripts/harden-stage3-rules.py
          rm .github/workflows/stage3-harden.yml
      - name: Commit hardened contracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security(meta-ads): harden TheoryConfig rules"
          git push origin HEAD:feature/meta-ads-theory-engine
