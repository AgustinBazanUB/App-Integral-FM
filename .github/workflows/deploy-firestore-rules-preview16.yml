name: Deploy Firestore Rules — Preview 16

on:
  push:
    branches:
      - fix/clientes-create-only-preview
    paths:
      - ".github/workflows/deploy-firestore-rules-preview16.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-rules-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT_STANDARD: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_APP_INTEGRAL_FM }}
          FIREBASE_SERVICE_ACCOUNT_LEGACY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INTEGRAL_FLOR_MIA }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_STANDARD" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_STANDARD" > "$RUNNER_TEMP/firebase-sa.json"
          elif [ -n "$FIREBASE_SERVICE_ACCOUNT_LEGACY" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_LEGACY" > "$RUNNER_TEMP/firebase-sa.json"
          else
            echo "::error::No Firebase service-account credential is configured."
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/firebase-sa.json"

      - name: Deploy Firestore Rules through Firebase Rules API
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          const projectId = 'app-integral-fm';
          const credentialPath = `${process.env.RUNNER_TEMP}/firebase-sa.json`;
          const rulesPath = 'firestore.rules';
          const sa = JSON.parse(fs.readFileSync(credentialPath, 'utf8'));
          const rules = fs.readFileSync(rulesPath, 'utf8');

          function b64url(value) {
            const buffer = Buffer.isBuffer(value) ? value : Buffer.from(value);
            return buffer.toString('base64')
              .replace(/=/g, '')
              .replace(/\+/g, '-')
              .replace(/\//g, '_');
          }

          async function getAccessToken() {
            const now = Math.floor(Date.now() / 1000);
            const header = b64url(JSON.stringify({ alg: 'RS256', typ: 'JWT' }));
            const claims = b64url(JSON.stringify({
              iss: sa.client_email,
              scope: 'https://www.googleapis.com/auth/cloud-platform',
              aud: 'https://oauth2.googleapis.com/token',
              iat: now,
              exp: now + 3600,
            }));
            const unsigned = `${header}.${claims}`;
            const signature = crypto.sign('RSA-SHA256', Buffer.from(unsigned), sa.private_key);
            const assertion = `${unsigned}.${b64url(signature)}`;
            const form = new URLSearchParams({
              grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
              assertion,
            });
            const response = await fetch('https://oauth2.googleapis.com/token', {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: form,
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`OAuth token exchange failed (${response.status}): ${text}`);
            const payload = JSON.parse(text);
            if (!payload.access_token) throw new Error('OAuth token response did not contain an access token.');
            console.log('Google OAuth token obtained with the existing Firebase service account.');
            return payload.access_token;
          }

          async function rulesApi(token, path, method, body) {
            const response = await fetch(`https://firebaserules.googleapis.com${path}`, {
              method,
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
              },
              body: body === undefined ? undefined : JSON.stringify(body),
            });
            const text = await response.text();
            let payload;
            try { payload = text ? JSON.parse(text) : {}; } catch { payload = { raw: text }; }
            return { ok: response.ok, status: response.status, payload };
          }

          (async () => {
            const token = await getAccessToken();

            const rulesetResult = await rulesApi(
              token,
              `/v1/projects/${projectId}/rulesets`,
              'POST',
              { source: { files: [{ name: 'firestore.rules', content: rules }] } },
            );
            if (!rulesetResult.ok) {
              throw new Error(`Ruleset creation failed (${rulesetResult.status}): ${JSON.stringify(rulesetResult.payload)}`);
            }
            const rulesetName = rulesetResult.payload.name;
            if (!rulesetName) throw new Error('Firebase Rules API created no ruleset name.');
            console.log(`Ruleset created: ${rulesetName}`);

            const releaseName = `projects/${projectId}/releases/cloud.firestore`;
            let releaseResult = await rulesApi(
              token,
              `/v1/${releaseName}`,
              'PATCH',
              {
                release: { name: releaseName, rulesetName },
                updateMask: 'rulesetName',
              },
            );

            if (releaseResult.status === 404) {
              releaseResult = await rulesApi(
                token,
                `/v1/projects/${projectId}/releases`,
                'POST',
                { name: releaseName, rulesetName },
              );
            }

            if (!releaseResult.ok) {
              throw new Error(`Rules release failed (${releaseResult.status}): ${JSON.stringify(releaseResult.payload)}`);
            }

            console.log(`Firestore Rules released successfully to ${projectId}.`);
            console.log(`Release: ${releaseResult.payload.name || releaseName}`);
            console.log(`Ruleset: ${releaseResult.payload.rulesetName || rulesetName}`);
            if (releaseResult.payload.updateTime) console.log(`Update time: ${releaseResult.payload.updateTime}`);
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
