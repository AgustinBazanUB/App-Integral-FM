name: Stage 4 baseline

on:
  push:
    branches: ["feature/meta-ads-campaign-planner"]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx firebase-tools@14.12.0 emulators:exec --only firestore --project demo-flor-mia-stage4-baseline "npm run test:rules"
      - run: npm run build
