name: patch WhatsApp 0.9.4 page

on:
  push:
    branches: [agent/rendimiento-vendedor-clientes]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/patch-whatsapp-094-page.mjs
      - name: Commit patch when changed
        shell: bash
        run: |
          if git diff --quiet -- src/gestion/pages/WhatsAppCampaignsPage.jsx src/gestion/marketing/whatsapp/extensionBridge.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gestion/pages/WhatsAppCampaignsPage.jsx src/gestion/marketing/whatsapp/extensionBridge.js
          git commit -m "perf: bound extension reconnect heartbeat"
          git push origin HEAD:agent/rendimiento-vendedor-clientes
