name: App WhatsApp 0.9.4.4 control plane

on:
  push:
    branches: [agent/rendimiento-vendedor-clientes]

permissions:
  contents: write

jobs:
  apply-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply and verify Web App control plane
        id: work
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/app-wa-0944.log
          {
            python3 -m py_compile .github/scripts/app-wa-0944.py
            python3 .github/scripts/app-wa-0944.py
            git status --short
            npm ci
            npm test
            npx firebase-tools@14.12.0 emulators:exec --only firestore --project demo-flor-mia-integral "npm run test:rules"
            npm run build
          } 2>&1 | tee /tmp/app-wa-0944.log
      - name: Publish verified Web App commit
        if: steps.work.outcome == 'success'
        shell: bash
        run: |
          git rm .github/scripts/app-wa-0944.py .github/scripts/app-wa-0944.payload .github/workflows/app-wa-0944.yml
          git rm -f .app-wa-0944-debug.txt 2>/dev/null || true
          rm -rf .github/scripts/__pycache__
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: centralize WhatsApp campaign controls in App Integral FM"
          git push origin agent/rendimiento-vendedor-clientes
      - name: Publish failure diagnostic only
        if: steps.work.outcome != 'success'
        shell: bash
        run: |
          git reset --hard HEAD
          tail -n 300 /tmp/app-wa-0944.log > .app-wa-0944-debug.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .app-wa-0944-debug.txt
          git commit -m "chore: capture App WhatsApp 0.9.4.4 failure"
          git push origin agent/rendimiento-vendedor-clientes
          exit 1
