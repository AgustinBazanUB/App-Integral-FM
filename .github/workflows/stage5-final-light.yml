name: Stage 5 final light verification

on:
  push:
    branches:
      - feature/meta-ads-creative-workspace

permissions:
  contents: write

jobs:
  stage5-final-light:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/meta-ads-creative-workspace
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply final Stage 5 fixes
        run: node scripts/finalize-stage5.mjs
      - name: Install dependencies
        run: npm ci
      - name: Stage 5 focused tests only
        run: node --test tests/meta-ads-creative-workspace-domain.test.mjs tests/meta-ads-drive-contract.test.mjs
      - name: Syntax and diff checks
        run: |
          node --check src/gestion/marketing/metaAds/creativeWorkspaceDomain.js
          node --check src/gestion/marketing/metaAds/googleDriveService.js
          node --check netlify/functions/_lib/serverFirestore.mjs
          node --check netlify/functions/_lib/googleDrive.mjs
          node --check netlify/functions/google-drive.mjs
          node --check netlify/functions/google-drive-callback.mjs
          git diff --check
      - name: Production build
        run: npm run build
      - name: Remove temporary finalization helpers
        run: |
          rm -f scripts/finalize-stage5.mjs
          rm -f .github/workflows/stage5-final-light.yml
      - name: Commit final light-verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix(meta-ads): harden Stage 5 Drive integration [light-verified]"
            git push origin HEAD:feature/meta-ads-creative-workspace
          fi
