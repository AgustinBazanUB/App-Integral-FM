name: WhatsApp Inbox Hardening

on:
  push:
    branches:
      - feature/whatsapp-inbox-crm
      - fix/whatsapp-inbox-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seller-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Seller permissions
        if: always()
        run: node --test --test-name-pattern="vendedor puro|administrador conserva" tests/seller-panel.test.mjs

      - name: Seller locations
        if: always()
        run: node --test --test-name-pattern="ubicaciones efectivas" tests/seller-panel.test.mjs

      - name: Seller product groups
        if: always()
        run: node --test --test-name-pattern="productos visibles" tests/seller-panel.test.mjs

      - name: Seller cart
        if: always()
        run: node --test --test-name-pattern="carrito calcula" tests/seller-panel.test.mjs

      - name: Seller discounts
        if: always()
        run: node --test --test-name-pattern="descuentos fijos|varios porcentajes|descuentos nunca" tests/seller-panel.test.mjs

      - name: Seller stock reservations
        if: always()
        run: node --test --test-name-pattern="ventas pendientes" tests/seller-panel.test.mjs

      - name: Seller keyboard
        if: always()
        run: node --test --test-name-pattern="botonera distingue" tests/seller-panel.test.mjs

      - name: Seller multiple payments
        if: always()
        run: node --test --test-name-pattern="2 pagos" tests/seller-panel.test.mjs

      - name: Seller route session
        if: always()
        run: node --test --test-name-pattern="ruta y el cambio" tests/seller-panel.test.mjs

      - name: Seller compact UI
        if: always()
        run: node --test --test-name-pattern="interfaz compacta" tests/seller-panel.test.mjs

      - name: Seller persisted sale fields
        if: always()
        run: node --test --test-name-pattern="venta guarda" tests/seller-panel.test.mjs

      - name: Seller offline queue
        if: always()
        run: node --test --test-name-pattern="cola offline" tests/seller-panel.test.mjs

      - name: Seller location sales
        if: always()
        run: node --test --test-name-pattern="Ubicaciones incorpora Ventas" tests/seller-panel.test.mjs

      - name: Seller responsive
        if: always()
        run: node --test --test-name-pattern="responsive compactas" tests/seller-panel.test.mjs

      - name: Seller Firestore rules
        if: always()
        run: node --test --test-name-pattern="reglas vinculan stock" tests/seller-panel.test.mjs
