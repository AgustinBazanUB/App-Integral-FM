name: WhatsApp Inbox Hardening

on:
  push:
    branches:
      - feature/whatsapp-inbox-crm
      - fix/whatsapp-inbox-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inbox-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Focused Inbox tests
        run: node --test tests/whatsapp-inbox-light.test.mjs

      - name: Full Web App test suite
        run: npm test

      - name: Build Web App
        run: npm run build
