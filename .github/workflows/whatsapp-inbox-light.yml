name: WhatsApp Inbox Hardening

on:
  push:
    branches:
      - fix/whatsapp-inbox-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sequential-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Focused Inbox tests
        run: node --test tests/whatsapp-inbox-light.test.mjs

      - name: Full Web App suite sequentially
        run: node --test --test-concurrency=1 tests/*.test.mjs

      - name: Build Web App
        run: npm run build
