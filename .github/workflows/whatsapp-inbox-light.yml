name: WhatsApp Inbox Hardening

on:
  push:
    branches:
      - fix/whatsapp-inbox-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  file-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Run every test file independently
        shell: bash
        run: |
          failed=0
          for file in tests/*.test.mjs; do
            echo "=== $file ==="
            if ! node --test "$file"; then
              echo "::error file=$file::FAILED_TEST_FILE $file"
              failed=1
            fi
          done
          exit "$failed"

      - name: Build Web App
        if: always()
        run: npm run build
