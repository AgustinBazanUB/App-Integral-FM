name: WhatsApp Inbox Hardening

on:
  push:
    branches:
      - feature/whatsapp-inbox-crm
      - fix/whatsapp-inbox-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inbox-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Focused Inbox tests
        run: node --test tests/whatsapp-inbox-light.test.mjs

      - name: activity-presentation
        if: always()
        run: node --test tests/activity-presentation.test.mjs
      - name: admin-experience
        if: always()
        run: node --test tests/admin-experience.test.mjs
      - name: auth-entry
        if: always()
        run: node --test tests/auth-entry.test.mjs
      - name: cancellation-metrics-filters
        if: always()
        run: node --test tests/cancellation-metrics-filters.test.mjs
      - name: dashboard-filters
        if: always()
        run: node --test tests/dashboard-filters.test.mjs
      - name: data
        if: always()
        run: node --test tests/data.test.mjs
      - name: global-overlay-focus
        if: always()
        run: node --test tests/global-overlay-focus.test.mjs
      - name: inventory-domain
        if: always()
        run: node --test tests/inventory-domain.test.mjs
      - name: location-enhancements
        if: always()
        run: node --test tests/location-enhancements.test.mjs
      - name: management-domain
        if: always()
        run: node --test tests/management-domain.test.mjs
      - name: management-ui
        if: always()
        run: node --test tests/management-ui.test.mjs
      - name: seller-panel
        if: always()
        run: node --test tests/seller-panel.test.mjs

      - name: Confirm passing Customer tests
        if: always()
        run: node --test tests/customer-domain.test.mjs tests/customer-import-ui.test.mjs
      - name: Confirm passing Meta Ads tests
        if: always()
        run: node --test tests/meta-ads-*.test.mjs
      - name: Confirm passing WhatsApp tests
        if: always()
        run: node --test tests/whatsapp-*.test.mjs
      - name: Build Web App
        if: always()
        run: npm run build
