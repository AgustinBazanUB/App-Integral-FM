name: WhatsApp Inbox Hardening

on:
  push:
    branches:
      - fix/whatsapp-inbox-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remaining-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Activity presentation
        if: always()
        run: node --test tests/activity-presentation.test.mjs
      - name: Admin experience
        if: always()
        run: node --test tests/admin-experience.test.mjs
      - name: Auth entry
        if: always()
        run: node --test tests/auth-entry.test.mjs
      - name: Cancellation metrics filters
        if: always()
        run: node --test tests/cancellation-metrics-filters.test.mjs
      - name: Dashboard filters
        if: always()
        run: node --test tests/dashboard-filters.test.mjs
      - name: Data
        if: always()
        run: node --test tests/data.test.mjs
      - name: Inventory domain
        if: always()
        run: node --test tests/inventory-domain.test.mjs
      - name: Seller panel after responsive cleanup
        if: always()
        run: node --test tests/seller-panel.test.mjs
