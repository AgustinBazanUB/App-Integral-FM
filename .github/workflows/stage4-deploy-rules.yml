name: Stage 4 deploy Firestore rules

on:
  push:
    branches: ["feature/meta-ads-campaign-planner"]

permissions:
  contents: write

jobs:
  deploy-rules:
    if: ${{ !contains(github.event.head_commit.message, '[stage4-rules-deployed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/meta-ads-campaign-planner
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Safety guard — exact Firebase target
        run: |
          set -euo pipefail
          node -e "const fs=require('node:fs'); const c=JSON.parse(fs.readFileSync('.firebaserc','utf8')); if(c.projects?.default!=='app-integral-fm') throw new Error('Unexpected Firebase default project: '+c.projects?.default)"
          git fetch origin feature/meta-ads-theory-engine:refs/remotes/origin/feature/meta-ads-theory-engine --depth=1
          git diff --exit-code origin/feature/meta-ads-theory-engine -- firestore.indexes.json
          echo 'Firebase target verified: app-integral-fm'
          echo 'Deployment scope verified: firestore:rules only'

      - name: Configure Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_APP_INTEGRAL_FM }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo 'FIREBASE_SERVICE_ACCOUNT_APP_INTEGRAL_FM is missing.' >&2
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Pre-deploy application tests
        run: npm test

      - name: Pre-deploy Firestore Rules Emulator
        run: npx firebase-tools@14.12.0 emulators:exec --only firestore --project demo-flor-mia-stage4-predeploy "npm run test:rules"

      - name: Pre-deploy production build
        run: npm run build

      - name: Deploy Firestore Rules only to app-integral-fm
        run: |
          set -euo pipefail
          npx firebase-tools@14.12.0 deploy --only firestore:rules --project app-integral-fm --non-interactive

      - name: Post-deploy Firestore Rules Emulator
        run: npx firebase-tools@14.12.0 emulators:exec --only firestore --project demo-flor-mia-stage4-postdeploy "npm run test:rules"

      - name: Post-deploy application tests
        run: npm test

      - name: Remove temporary deployment workflow
        run: rm -f .github/workflows/stage4-deploy-rules.yml

      - name: Commit deployment checkpoint cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(meta-ads): confirm Stage 4 rules deployment [stage4-rules-deployed]"
            git push origin HEAD:feature/meta-ads-campaign-planner
          fi
