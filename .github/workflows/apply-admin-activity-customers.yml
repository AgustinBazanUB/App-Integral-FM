          replace('src/main.jsx', 'import "./styles/seller-customers.css";\n', 'import "./styles/seller-customers.css";\nimport "./styles/admin-activity-customers.css";\n')

          # Tests de regresión de esta etapa.
          write('tests/admin-activity-customers.test.mjs', r'''import test from "node:test";
import assert from "node:assert/strict";
import { readFileSync } from "node:fs";
import { activityTypeMeta } from "../src/gestion/activity/activityPresentation.js";
import { customerWhatsAppUrl, formatPhoneForDisplay, normalizeCustomerPhone, phoneForWhatsApp } from "../src/gestion/customers/customerDomain.js";
const read = (path) => readFileSync(new URL(`../${path}`, import.meta.url), "utf8");

test("teléfono CABA conserva normalización y usa formato legible", () => {
  assert.equal(normalizeCustomerPhone("+54 9 11 5757-1979"), "1157571979");
  assert.equal(formatPhoneForDisplay("1157571979"), "11-5757-1979");
  assert.equal(phoneForWhatsApp("1157571979"), "5491157571979");
  assert.equal(customerWhatsAppUrl("1157571979"), "https://wa.me/5491157571979");
});

test("otros teléfonos no se truncan al formatear", () => {
  assert.equal(formatPhoneForDisplay("2615551234").replace(/-/g, ""), "2615551234");
});

test("actividad utiliza mapa semántico central con fallback", () => {
  assert.equal(activityTypeMeta("sale.created").icon, "ReceiptText");
  assert.equal(activityTypeMeta("sale.cancelled").icon, "Ban");
  assert.equal(activityTypeMeta("customer.updated").icon, "UserRoundPen");
  assert.equal(activityTypeMeta("unknown.event").icon, "Activity");
});

test("header usa portal y una sola flecha dentro del botón de perfil", () => {
  const shell = read("src/gestion/ManagementShell.jsx");
  const popover = read("src/gestion/components/HeaderPopover.jsx");
  assert.match(popover, /createPortal/);
  assert.match(shell, /className="fm-profile-button"/);
  assert.match(shell, /aria-expanded=\{profileOpen\}/);
  assert.doesNotMatch(shell, /<Dropdown/);
});

test("clientes permiten detalle edición WhatsApp y paginación", () => {
  const page = read("src/gestion/pages/LoyalCustomersPage.jsx");
  const service = read("src/gestion/services/customerService.js");
  assert.match(page, /Detalle del cliente/);
  assert.match(page, /target="_blank" rel="noopener noreferrer"/);
  assert.match(service, /listCustomersPage/);
  assert.match(service, /Ya existe otro cliente con ese número de teléfono/);
  assert.match(service, /action: "customer.updated"/);
});
''')

