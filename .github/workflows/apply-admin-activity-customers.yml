name: Apply Admin Activity Customers

on:
  push:
    branches:
      - agent/rendimiento-vendedor-clientes
    paths:
      - .github/workflows/apply-admin-activity-customers.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rendimiento-vendedor-clientes
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply requested changes
        run: |
          python .github/scripts/apply-admin-activity-customers.py
          python .github/scripts/patch-admin-stage-tests.py

      - name: Install dependencies
        run: npm ci

      - name: Run application tests
        run: npm test

      - name: Run Firestore rules tests
        run: npx firebase-tools@14.12.0 emulators:exec --only firestore --project demo-flor-mia-integral "npm run test:rules"

      - name: Build production bundle
        run: npm run build

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src firestore.rules tests
          git diff --cached --quiet && exit 0
          git commit -m "[skip netlify] Mejorar administrador actividad y clientes"
          git push origin HEAD:agent/rendimiento-vendedor-clientes
