export async function updateCustomerFromAdmin(profile, currentCustomer, input) {
  if (!can(profile, "loyal-customers", "edit")) throw new Error("No tenés permiso para editar clientes.");
  if (!currentCustomer?.id) throw new Error("El cliente no existe.");
  const draft = buildCustomerDraft(input);
  const nextId = await customerDocumentId(draft.phoneNormalized);
  const currentRef = doc(db, "customers", currentCustomer.id);
  const nextRef = doc(db, "customers", nextId);
  const auditRef = doc(collection(db, "auditLogs"));
  await runTransaction(db, async (transaction) => {
    const currentSnap = await transaction.get(currentRef);
    if (!currentSnap.exists()) throw new Error("El cliente ya no existe.");
    const currentData = currentSnap.data();
    let targetData = currentData;
    if (nextId !== currentCustomer.id) {
      const targetSnap = await transaction.get(nextRef);
      if (targetSnap.exists() && targetSnap.data().deleted !== true) {
        throw new Error("Ya existe otro cliente con ese número de teléfono.");
      }
      targetData = {
        ...currentData,
        customerKey: nextId,
        createdBy: profile.id,
        createdByName: userName(profile),
        createdAt: serverTimestamp(),
        migratedFromCustomerId: currentCustomer.id,
      };
    }
    const nextPayload = {
      ...targetData,
      customerKey: nextId,
      phone: draft.phone,
      phoneNormalized: draft.phoneNormalized,
      name: draft.name || null,
      zoneId: draft.zoneId || null,
      zoneName: draft.zoneName,
      customZone: draft.customZone || null,
      active: true,
      deleted: false,
      updatedBy: profile.id,
      updatedByName: userName(profile),
      updatedAt: serverTimestamp(),
    };
    transaction.set(nextRef, nextPayload, { merge: true });
    if (nextId !== currentCustomer.id) {
      transaction.set(currentRef, {
        active: false,
        deleted: true,
        mergedInto: nextId,
        phoneReplacedAt: serverTimestamp(),
        updatedBy: profile.id,
        updatedByName: userName(profile),
        updatedAt: serverTimestamp(),
      }, { merge: true });
    }
    transaction.set(auditRef, {
      action: "customer.updated",
      moduleId: "loyal-customers",
      entityType: "customer",
      entityId: nextId,
      title: "Cliente actualizado",
      description: "Datos principales del cliente actualizados.",
      userId: profile.id,
      userName: userName(profile),
      createdAt: serverTimestamp(),
      status: "completed",
    });
  });
  return nextId;
}
'''
