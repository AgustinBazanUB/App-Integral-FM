          addition = r'''

export function formatPhoneForDisplay(value) {
  const digits = normalizeCustomerPhone(value);
  if (!digits) return "Sin teléfono";
  if (digits.length === 10 && digits.startsWith("11")) return `${digits.slice(0, 2)}-${digits.slice(2, 6)}-${digits.slice(6)}`;
  if (digits.length === 10) return `${digits.slice(0, 3)}-${digits.slice(3, 6)}-${digits.slice(6)}`;
  if (digits.length === 11) return `${digits.slice(0, 4)}-${digits.slice(4, 7)}-${digits.slice(7)}`;
  if (digits.length >= 8) return digits.replace(/(.{4})(?=.)/g, "$1-");
  return digits;
}

export function phoneForWhatsApp(value) {
  const digits = normalizeCustomerPhone(value);
  if (!digits) return "";
  // Los clientes argentinos se almacenan en formato nacional. Para móviles de
  // 10 dígitos WhatsApp utiliza 54 + 9 + código de área + abonado.
  if (digits.length === 10) return `549${digits}`;
  return digits.startsWith("54") ? digits : `54${digits}`;
}

export function customerWhatsAppUrl(value) {
  const number = phoneForWhatsApp(value);
  return number ? `https://wa.me/${number}` : "";
}
'''
