name: Apply Admin Activity Customers

on:
  push:
    branches:
      - agent/rendimiento-vendedor-clientes
    paths:
      - .github/workflows/apply-admin-activity-customers.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rendimiento-vendedor-clientes

      - name: Apply staged improvements
        shell: python
        run: |
          from pathlib import Path

          def write(path, content):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content, encoding='utf-8')

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'No se encontró bloque esperado en {path}: {old[:90]!r}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

