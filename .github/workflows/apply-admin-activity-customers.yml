          write('src/gestion/pages/LoyalCustomersPage.jsx', r'''import { useEffect, useMemo, useState } from "react";
import { Badge, Button, EmptyState, FormField, Modal, PageHeader, Panel, SearchInput, Skeleton, Tabs, Toast } from "../../design-system";
import { customerDisplayName, customerWhatsAppUrl, customerZoneLabel, formatPhoneForDisplay, matchesCustomerSearch, normalizeCustomerPhone } from "../customers/customerDomain";
import { useAuth } from "../AuthContext";
import { Icon } from "../components/icons";
import { formatDateTime } from "../formatters";
import { useAsyncData } from "../hooks";
import { can } from "../permissions";
import { listCustomerZones, listCustomersPage, saveCustomerFromAdmin, saveCustomerZone, setCustomerZoneActive, updateCustomerFromAdmin } from "../services/customerService";

const blankCustomer = { phone: "", zoneId: "", customZone: "", name: "" };
const blankZone = { name: "", order: 0, active: true };

function customerPhone(customer) { return customer.phoneNormalized || customer.phone || ""; }

function customerToForm(customer, zones) {
  const zoneId = customer.zoneId && zones.some((zone) => zone.id === customer.zoneId) ? customer.zoneId : "__custom";
  return { phone: customerPhone(customer), name: customer.name || "", zoneId, customZone: zoneId === "__custom" ? customerZoneLabel(customer) : "" };
}

function CustomersList({ customers, onOpen }) {
  if (!customers.length) return <EmptyState icon="UsersRound" title="No hay clientes para mostrar" description="Los clientes identificados desde una venta aparecerán aquí automáticamente." />;
  return <div className="fm-customers-list">{customers.map((customer) => {
    const visiblePhone = formatPhoneForDisplay(customerPhone(customer));
    const whatsapp = customerWhatsAppUrl(customerPhone(customer));
    return <article key={customer.id} className="fm-customer-card" role="button" tabIndex="0" onClick={() => onOpen(customer)} onKeyDown={(event) => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); onOpen(customer); } }}>
      <div className="fm-customer-card__identity"><span className="fm-customer-card__icon"><Icon name="UserRound" /></span><div>{customer.name ? <strong>{customerDisplayName(customer)}</strong> : <strong>Cliente sin nombre</strong>}{whatsapp ? <a className="fm-customer-phone-link" href={whatsapp} target="_blank" rel="noopener noreferrer" aria-label={`Abrir WhatsApp con ${visiblePhone}`} onClick={(event) => event.stopPropagation()} onKeyDown={(event) => event.stopPropagation()}><Icon name="MessageCircle" /><b>{visiblePhone}</b></a> : <b>{visiblePhone}</b>}{customerZoneLabel(customer) ? <span><Icon name="MapPin" />{customerZoneLabel(customer)}</span> : null}</div></div>
      <Badge tone={customer.active === false ? "neutral" : "success"}>{customer.active === false ? "Inactivo" : "Activo"}</Badge>
    </article>;
  })}</div>;
}

export default function LoyalCustomersPage() {
  const { profile } = useAuth();
  const canCreateCustomers = can(profile, "loyal-customers", "create") || can(profile, "loyal-customers", "edit");
  const canEditCustomers = can(profile, "loyal-customers", "edit");
  const canManageZones = can(profile, "loyal-customers", "edit") || can(profile, "loyal-customers", "admin");
  const zonesResult = useAsyncData(() => listCustomerZones(profile), [profile.id]);
  const [customersState, setCustomersState] = useState({ status: "loading", items: [], cursor: null, hasMore: false, error: null });
  const [tab, setTab] = useState("customers");
  const [search, setSearch] = useState("");
  const [customerOpen, setCustomerOpen] = useState(false);
  const [editingCustomer, setEditingCustomer] = useState(null);
  const [detailCustomer, setDetailCustomer] = useState(null);
  const [customerForm, setCustomerForm] = useState(blankCustomer);
  const [customerBusy, setCustomerBusy] = useState(false);
  const [customerError, setCustomerError] = useState("");
  const [zoneOpen, setZoneOpen] = useState(false);
  const [zoneForm, setZoneForm] = useState(blankZone);
  const [editingZoneId, setEditingZoneId] = useState("");
  const [zoneBusy, setZoneBusy] = useState(false);
  const [zoneError, setZoneError] = useState("");
  const [message, setMessage] = useState("");

  const zones = zonesResult.data || [];
  const activeZones = zones.filter((zone) => zone.active !== false);

  const loadCustomers = async ({ append = false } = {}) => {
    setCustomersState((current) => ({ ...current, status: append ? "loading-more" : "loading", error: null }));
    try {
      const page = await listCustomersPage(profile, 40, append ? customersState.cursor : null);
      setCustomersState((current) => ({ status: "ready", items: append ? [...current.items, ...page.items] : page.items, cursor: page.cursor, hasMore: page.hasMore, error: null }));
    } catch (error) {
      setCustomersState((current) => ({ ...current, status: "error", error }));
    }
  };

  useEffect(() => { loadCustomers(); /* eslint-disable-next-line react-hooks/exhaustive-deps */ }, [profile.id]);

  const filteredCustomers = useMemo(() => customersState.items.filter((customer) => matchesCustomerSearch(customer, search)), [customersState.items, search]);
  const openNewCustomer = () => { setEditingCustomer(null); setCustomerForm(blankCustomer); setCustomerError(""); setCustomerOpen(true); };
  const openDetail = (customer) => setDetailCustomer(customer);
  const openEditCustomer = (customer) => { setDetailCustomer(null); setEditingCustomer(customer); setCustomerForm(customerToForm(customer, zones)); setCustomerError(""); setCustomerOpen(true); };

  const saveCustomer = async () => {
    setCustomerBusy(true); setCustomerError("");
    try {
      const selectableZones = [...activeZones, ...zones.filter((zone) => zone.id === editingCustomer?.zoneId)];
      const selectedZone = selectableZones.find((zone) => zone.id === customerForm.zoneId);
      const payload = { phone: customerForm.phone, name: customerForm.name, zoneId: selectedZone?.id || "", zoneName: selectedZone?.name || "", customZone: customerForm.zoneId === "__custom" ? customerForm.customZone : "" };
      if (editingCustomer) await updateCustomerFromAdmin(profile, editingCustomer, payload);
      else await saveCustomerFromAdmin(profile, payload);
      setCustomerOpen(false); setEditingCustomer(null); setCustomerForm(blankCustomer); await loadCustomers();
      setMessage(editingCustomer ? "Cliente actualizado correctamente." : "Cliente guardado correctamente.");
    } catch (error) { setCustomerError(error.message); } finally { setCustomerBusy(false); }
  };

  const openNewZone = () => { setEditingZoneId(""); setZoneForm(blankZone); setZoneError(""); setZoneOpen(true); };
  const openEditZone = (zone) => { setEditingZoneId(zone.id); setZoneForm({ name: zone.name || "", order: Number(zone.order || 0), active: zone.active !== false }); setZoneError(""); setZoneOpen(true); };
  const saveZone = async () => { setZoneBusy(true); setZoneError(""); try { await saveCustomerZone(profile, zoneForm, editingZoneId || null); setZoneOpen(false); await zonesResult.refresh(); setMessage(editingZoneId ? "Zona actualizada." : "Zona creada."); } catch (error) { setZoneError(error.message); } finally { setZoneBusy(false); } };
  const toggleZone = async (zone) => { try { await setCustomerZoneActive(profile, zone, zone.active === false); await zonesResult.refresh(); setMessage(zone.active === false ? "Zona activada." : "Zona desactivada. Los registros históricos se conservan."); } catch (error) { setMessage(error.message); } };

  const selectableZones = useMemo(() => {
    const map = new Map(activeZones.map((zone) => [zone.id, zone]));
    if (editingCustomer?.zoneId) { const historical = zones.find((zone) => zone.id === editingCustomer.zoneId); if (historical) map.set(historical.id, historical); }
    return [...map.values()];
  }, [activeZones, zones, editingCustomer]);

  return <div className="fm-page fm-customers-page">
    <PageHeader eyebrow="CRM operativo" title="Clientes Fidelizados" description="Base única de clientes identificada por teléfono, con detalle y edición administrativa." actions={tab === "customers" && canCreateCustomers ? <Button icon="UserPlus" onClick={openNewCustomer}>Nuevo cliente</Button> : tab === "zones" && canManageZones ? <Button icon="Plus" onClick={openNewZone}>Nueva zona</Button> : null} />
    <Tabs tabs={[{ id: "customers", label: "Clientes" }, ...(canManageZones ? [{ id: "zones", label: "Configuración de zonas" }] : [])]} active={tab} onChange={setTab} />
    {message ? <Toast tone={message.toLocaleLowerCase().includes("error") ? "error" : "success"}>{message}</Toast> : null}
    {tab === "customers" ? <Panel title="Registro de clientes" description="Se cargan 40 registros por página. La venta resuelve un teléfono por ID determinístico y nunca descarga la colección completa." action={<Badge tone="neutral">{filteredCustomers.length} visibles</Badge>}>
      <div className="fm-customers-toolbar"><SearchInput label="Buscar por teléfono, nombre o zona" value={search} onChange={(event) => setSearch(event.target.value)} autoComplete="off" />{search && normalizeCustomerPhone(search) ? <small>Teléfono normalizado: {normalizeCustomerPhone(search)}</small> : null}</div>
      {customersState.status === "loading" ? <Skeleton lines={6} /> : null}
      {customersState.status === "error" ? <Toast tone="error">{customersState.error?.message}</Toast> : null}
      {customersState.items.length ? <CustomersList customers={filteredCustomers} onOpen={openDetail} /> : null}
      {customersState.status === "ready" && !customersState.items.length ? <EmptyState icon="UsersRound" title="No hay clientes para mostrar" description="Los clientes identificados desde una venta aparecerán aquí automáticamente." /> : null}
      {customersState.hasMore ? <div className="fm-load-more"><Button variant="secondary" loading={customersState.status === "loading-more"} onClick={() => loadCustomers({ append: true })}>Cargar más clientes</Button></div> : null}
    </Panel> : <Panel title="Zonas" description="Las zonas inactivas dejan de ofrecerse en ventas nuevas, pero siguen visibles en clientes históricos.">{zonesResult.status === "loading" ? <Skeleton lines={5} /> : null}{zonesResult.status === "error" ? <Toast tone="error">{zonesResult.error.message}</Toast> : null}<div className="fm-zones-list">{zones.map((zone) => <article key={zone.id} className="fm-zone-row"><div><strong>{zone.name}</strong><small>Orden {Number(zone.order || 0)}</small></div><Badge tone={zone.active === false ? "neutral" : "success"}>{zone.active === false ? "Inactiva" : "Activa"}</Badge>{canManageZones ? <div className="fm-zone-row__actions"><button type="button" onClick={() => openEditZone(zone)}><Icon name="Settings2" />Editar</button><button type="button" onClick={() => toggleZone(zone)}><Icon name={zone.active === false ? "Play" : "Pause"} />{zone.active === false ? "Activar" : "Desactivar"}</button></div> : null}</article>)}</div></Panel>}

    <Modal open={Boolean(detailCustomer)} onClose={() => setDetailCustomer(null)} title="Detalle del cliente" description="Información principal del cliente fidelizado." footer={canEditCustomers ? <div className="fm-dialog-actions"><Button variant="secondary" onClick={() => setDetailCustomer(null)}>Cerrar</Button><Button icon="Pencil" onClick={() => openEditCustomer(detailCustomer)}>Editar</Button></div> : <Button variant="secondary" onClick={() => setDetailCustomer(null)}>Cerrar</Button>}>
      {detailCustomer ? <div className="fm-customer-detail"><div><small>Nombre</small><strong>{detailCustomer.name || "Sin nombre"}</strong></div><div><small>Teléfono</small><a href={customerWhatsAppUrl(customerPhone(detailCustomer))} target="_blank" rel="noopener noreferrer"><Icon name="MessageCircle" />{formatPhoneForDisplay(customerPhone(detailCustomer))}</a></div><div><small>Zona</small><strong>{customerZoneLabel(detailCustomer) || "Sin zona"}</strong></div>{detailCustomer.createdAt ? <div><small>Fecha de alta</small><strong>{formatDateTime(detailCustomer.createdAt)}</strong></div> : null}{detailCustomer.lastPurchaseAt ? <div><small>Última compra</small><strong>{formatDateTime(detailCustomer.lastPurchaseAt)}</strong></div> : null}</div> : null}
    </Modal>

    <Modal open={customerOpen} onClose={() => !customerBusy && setCustomerOpen(false)} title={editingCustomer ? "Editar cliente" : "Nuevo cliente"} description={editingCustomer ? "Los cambios se guardan solamente al confirmar." : "Teléfono y zona son suficientes; el nombre es opcional."} footer={<div className="fm-dialog-actions"><Button variant="secondary" onClick={() => setCustomerOpen(false)}>Cancelar</Button><Button icon="Save" loading={customerBusy} onClick={saveCustomer}>Guardar</Button></div>}>
      <div className="fm-customer-form"><FormField label="Teléfono" required hint="Se normaliza para evitar duplicados y se muestra en formato local legible."><input type="tel" inputMode="tel" autoComplete="tel" value={customerForm.phone} onChange={(event) => setCustomerForm((current) => ({ ...current, phone: event.target.value }))} /></FormField><FormField label="Zona" required><select value={customerForm.zoneId} onChange={(event) => setCustomerForm((current) => ({ ...current, zoneId: event.target.value }))}><option value="">Elegir zona</option>{selectableZones.map((zone) => <option key={zone.id} value={zone.id}>{zone.name}{zone.active === false ? " (histórica)" : ""}</option>)}<option value="__custom">Otra zona</option></select></FormField>{customerForm.zoneId === "__custom" ? <FormField label="Otra zona" required><input value={customerForm.customZone} onChange={(event) => setCustomerForm((current) => ({ ...current, customZone: event.target.value }))} /></FormField> : null}<FormField label="Nombre (opcional)"><input autoComplete="name" value={customerForm.name} onChange={(event) => setCustomerForm((current) => ({ ...current, name: event.target.value }))} /></FormField>{customerError ? <Toast tone="error">{customerError}</Toast> : null}</div>
    </Modal>

    <Modal open={zoneOpen} onClose={() => !zoneBusy && setZoneOpen(false)} title={editingZoneId ? "Editar zona" : "Nueva zona"} description="La zona quedará disponible para la captura rápida del Panel Vendedor." footer={<div className="fm-dialog-actions"><Button variant="secondary" onClick={() => setZoneOpen(false)}>Cancelar</Button><Button icon="Save" loading={zoneBusy} onClick={saveZone}>Guardar</Button></div>}><div className="fm-customer-form"><FormField label="Nombre de la zona" required><input value={zoneForm.name} onChange={(event) => setZoneForm((current) => ({ ...current, name: event.target.value }))} /></FormField><FormField label="Orden"><input type="number" min="0" step="1" inputMode="numeric" value={zoneForm.order} onChange={(event) => setZoneForm((current) => ({ ...current, order: event.target.value }))} /></FormField><label className="fm-zone-active-toggle"><input type="checkbox" checked={zoneForm.active !== false} onChange={(event) => setZoneForm((current) => ({ ...current, active: event.target.checked }))} /><span>Zona activa</span></label>{zoneError ? <Toast tone="error">{zoneError}</Toast> : null}</div></Modal>
  </div>;
}
''')

          write('src/styles/admin-activity-customers.css', r'''.fm-management-header__actions{align-items:center;gap:10px;overflow:visible}.fm-connection-trigger{min-height:38px;display:inline-flex;align-items:center;gap:7px;padding:0 11px;border:1px solid var(--fm-border,#ded5c6);border-radius:999px;background:#fff;color:#27231d;font:inherit;font-size:.82rem;font-weight:700;cursor:pointer;white-space:nowrap}.fm-connection-trigger svg{width:16px;height:16px}.fm-connection-trigger.is-online svg{color:#65764b}.fm-connection-trigger.is-offline svg{color:#9a543f}.fm-connection-trigger.is-reconnecting svg{animation:spin 1s linear infinite}.fm-header-popover{position:fixed;z-index:1200;max-height:min(70vh,560px);overflow:auto;border:1px solid #e5dccd;border-radius:14px;background:#fff;color:#171512;box-shadow:0 20px 55px rgb(43 34 21 / 18%);padding:14px}.fm-connection-popover header{display:flex;align-items:center;gap:10px}.fm-connection-popover header div{display:grid;gap:2px}.fm-connection-popover header small{color:#776d61}.fm-connection-popover p{margin:12px 0;color:#4b443c;font-size:.9rem;line-height:1.45}.fm-connection-state-icon{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:#f5f1e8}.fm-connection-state-icon svg{width:18px}.fm-connection-feedback{display:block;margin-top:9px;color:#4b443c}.fm-profile-button{display:flex;align-items:center;gap:9px;min-height:46px;padding:4px 8px;border:0;border-radius:12px;background:transparent;color:inherit;cursor:pointer;text-align:left}.fm-profile-button:hover,.fm-profile-button:focus-visible{background:#f5f1e8}.fm-profile-button>.fm-avatar{flex:0 0 auto}.fm-profile-button__text{display:grid;align-content:center;gap:1px;line-height:1.15}.fm-profile-button__text strong{font-size:.86rem}.fm-profile-button__text small{font-size:.72rem;color:#786f64}.fm-profile-button>svg{width:16px;height:16px;margin-left:2px}.fm-profile-popover{padding:7px}.fm-profile-menu{display:grid;gap:2px}.fm-profile-menu