};

const prefixFallback = [
  ["sale.", { icon: "ReceiptText", tone: "gold", group: "Ventas" }],
  ["stock.", { icon: "Boxes", tone: "olive", group: "Stock" }],
  ["location.", { icon: "MapPin", tone: "olive", group: "Ubicaciones" }],
  ["customer.", { icon: "UserRound", tone: "customer", group: "Clientes" }],
  ["product.", { icon: "PackageCheck", tone: "olive", group: "Productos" }],
  ["discount.", { icon: "Percent", tone: "gold", group: "Descuentos" }],
];

export function activityTypeMeta(action = "") {
  if (ACTIVITY_CATALOG[action]) return { action, ...ACTIVITY_CATALOG[action] };
  const fallback = prefixFallback.find(([prefix]) => String(action).startsWith(prefix))?.[1];
  return {
    action,
    label: action || "Actividad",
    icon: fallback?.icon || "Activity",
    tone: fallback?.tone || "neutral",
    group: fallback?.group || "Otros",
  };
}

export function activityTypeGroups(extraActions = []) {
  const actions = [...new Set([...Object.keys(ACTIVITY_CATALOG), ...extraActions.filter(Boolean)])];
  const groups = new Map();
  actions.forEach((action) => {
    const meta = activityTypeMeta(action);
    if (!groups.has(meta.group)) groups.set(meta.group, []);
    groups.get(meta.group).push(meta);
  });
  return [...groups.entries()].map(([label, items]) => ({
    label,
    items: items.sort((a, b) => a.label.localeCompare(b.label, "es")),
  }));
}
''')

          write('src/gestion/components/HeaderPopover.jsx', r'''import { useEffect, useLayoutEffect, useRef, useState } from "react";
import { createPortal } from "react-dom";

export default function HeaderPopover({ open, onClose, anchorRef, children, className = "", ariaLabel }) {
  const panelRef = useRef(null);
  const [position, setPosition] = useState({ top: 0, left: 0, width: 320 });

  const updatePosition = () => {
    const anchor = anchorRef.current;
    if (!anchor) return;
    const rect = anchor.getBoundingClientRect();
    const width = Math.min(360, Math.max(260, window.innerWidth - 24));
    const left = Math.min(window.innerWidth - width - 12, Math.max(12, rect.right - width));
    setPosition({ top: Math.min(window.innerHeight - 12, rect.bottom + 8), left, width });
  };

  useLayoutEffect(() => {
    if (open) updatePosition();
  }, [open]);

  useEffect(() => {
    if (!open) return undefined;
    const previous = document.activeElement;
    const onPointerDown = (event) => {
      if (panelRef.current?.contains(event.target) || anchorRef.current?.contains(event.target)) return;
      onClose();
    };
    const onKeyDown = (event) => {
      if (event.key === "Escape") {
        event.preventDefault();
        onClose();
      }
    };
    const onViewport = () => updatePosition();
    document.addEventListener("pointerdown", onPointerDown, true);
    document.addEventListener("keydown", onKeyDown);
    window.addEventListener("resize", onViewport, { passive: true });
    window.addEventListener("scroll", onViewport, true);
    const frame = window.requestAnimationFrame(() => panelRef.current?.querySelector("a,button,[tabindex='0']")?.focus?.());
    return () => {
      window.cancelAnimationFrame(frame);
      document.removeEventListener("pointerdown", onPointerDown, true);
      document.removeEventListener("keydown", onKeyDown);
      window.removeEventListener("resize", onViewport);
      window.removeEventListener("scroll", onViewport, true);
      if (previous === anchorRef.current || panelRef.current?.contains(previous)) anchorRef.current?.focus?.();
    };
  }, [open, onClose, anchorRef]);

  if (!open || typeof document === "undefined") return null;
  return createPortal(
    <div
      ref={panelRef}
      className={`fm-header-popover ${className}`}
      role="dialog"
      aria-label={ariaLabel}
      style={{ top: position.top, left: position.left, width: position.width }}
    >
      {children}
    </div>,
    document.body,
  );
}
''')

          write('src/gestion/components/ConnectionIndicator.jsx', r'''import { useCallback, useRef, useState } from "react";
import { Button } from "../../design-system";
import { reconnectFirestore } from "../connection";
import { useAuth } from "../AuthContext";
import { useConnectionStatus } from "../hooks";
import HeaderPopover from "./HeaderPopover";
import { Icon } from "./icons";

const labels = { online: "En línea", offline: "Sin conexión", reconnecting: "Reconectando" };

export default function ConnectionIndicator() {
  const { profile } = useAuth();
  const status = useConnectionStatus();
  const [open, setOpen] = useState(false);
  const [message, setMessage] = useState("");
  const anchorRef = useRef(null);
  const busy = status === "reconnecting";
  const online = status === "online";
  const close = useCallback(() => setOpen(false), []);

  const reconnect = async () => {
    setMessage("");
    try {
      const connected = await reconnectFirestore(profile.id);
      setMessage(connected ? "Conexión restablecida." : "No se pudo restablecer la conexión.");
    } catch {
      setMessage("No se pudo restablecer la conexión.");
    }
  };

  return (
    <>
      <button
        ref={anchorRef}
        type="button"
        className={`fm-connection-trigger is-${status}`}
        onClick={() => setOpen((value) => !value)}
        aria-haspopup="dialog"
        aria-expanded={open}
        aria-label={`Estado de conexión: ${labels[status]}`}
      >
        <Icon name={busy ? "RefreshCw" : online ? "Wifi" : "WifiOff"} />
        <span>{labels[status]}</span>
      </button>
      <HeaderPopover open={open} onClose={close} anchorRef={anchorRef} className="fm-connection-popover" ariaLabel="Estado de conexión">
        <header><span className={`fm-connection-state-icon is-${status}`}><Icon name={busy ? "RefreshCw" : online ? "Wifi" : "WifiOff"} /></span><div><small>Estado de conexión</small><strong>{labels[status]}</strong></div></header>
        <p>{online ? "Conexión disponible." : "Sin conexión con Firebase. Podés seguir usando las funciones offline disponibles."}</p>
        {!online ? <Button icon="RefreshCw" disabled={busy} onClick={reconnect}>{busy ? "Reconectando…" : "Reconectar"}</Button> : null}
        {message ? <small className="fm-connection-feedback" aria-live="polite">{message}</small> : null}
      </HeaderPopover>
    </>
  );
}
''')

