name: Auditoría núcleo de ventas

on:
  push:
    branches: ["audit/core-sales-20260923"]

permissions:
  contents: read

jobs:
  validate-core-sales:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Pruebas núcleo auditado
        run: |
          node --test tests/core-sales-audit.test.mjs tests/inventory-domain.test.mjs tests/performance-metrics.test.mjs
          node --test --test-name-pattern="resumen diario|ruta y el cambio entre paneles|interfaz compacta descuentos|venta guarda creador|cola offline|reglas vinculan stock" tests/seller-panel.test.mjs
      - name: Reglas Firestore
        run: npx firebase-tools@14.12.0 emulators:exec --only firestore --project demo-flor-mia-integral "npm run test:rules"
      - name: Build
        run: npm run build
