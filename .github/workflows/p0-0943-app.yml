name: apply-whatsapp-0.9.4.3-web-app

on:
  push:
    branches: [agent/rendimiento-vendedor-clientes]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Apply 0.9.4.3 Web App integration
        id: work
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/p0-app.log
          {
            python3 - <<'PY'
          from pathlib import Path

          def read(p): return Path(p).read_text()
          def write(p,s): Path(p).write_text(s)
          def repl(p, old, new, count=1):
              s=read(p)
              if old not in s: raise SystemExit(f'missing marker {p}: {old[:120]!r}')
              write(p, s.replace(old,new,count))

          p='src/gestion/marketing/whatsapp/campaignDomain.js'
          old='''export function safeCampaignCounters(totalRecipients, sentCount, errorCount = 0) {\n  const total = Math.max(0, Number(totalRecipients || 0));\n  const sent = Math.max(0, Math.min(total, Number(sentCount || 0)));\n  const errors = Math.max(0, Math.min(Math.max(0, total - sent), Number(errorCount || 0)));\n  const processed = Math.min(total, sent + errors);\n  return {\n    total,\n    sent,\n    errors,\n    failed: errors,\n    processed,\n    remaining: Math.max(0, total - processed),\n    progress: progressPercentage(total, processed),\n  };\n}\n\nexport function extensionCampaignCounters(payload = {}, current = {}) {\n  const total = payload.total ?? payload.progress?.total ?? current.totalRecipients;\n  return safeCampaignCounters(\n    total,\n    payload.sent ?? current.sentCount,\n    payload.failed ?? payload.finalSummary?.failed ?? current.errorCount,\n  );\n}\n'''
          new='''export function safeCampaignCounters(totalRecipients, sentCount, errorCount = 0, confirmedSentCount = null, unverifiedSentCount = null) {\n  const total = Math.max(0, Number(totalRecipients || 0));\n  const sent = Math.max(0, Math.min(total, Number(sentCount || 0)));\n  const errors = Math.max(0, Math.min(Math.max(0, total - sent), Number(errorCount || 0)));\n  const explicitUnverified = unverifiedSentCount == null ? 0 : Math.max(0, Number(unverifiedSentCount || 0));\n  const unverifiedSent = Math.min(sent, explicitUnverified);\n  const fallbackConfirmed = Math.max(0, sent - unverifiedSent);\n  const confirmedSent = confirmedSentCount == null\n    ? fallbackConfirmed\n    : Math.min(fallbackConfirmed, Math.max(0, Number(confirmedSentCount || 0)));\n  const accountedSent = confirmedSent + unverifiedSent;\n  const normalizedConfirmed = accountedSent < sent ? confirmedSent + (sent - accountedSent) : confirmedSent;\n  const processed = Math.min(total, sent + errors);\n  return {\n    total,\n    sent,\n    confirmedSent: normalizedConfirmed,\n    unverifiedSent,\n    errors,\n    failed: errors,\n    processed,\n    remaining: Math.max(0, total - processed),\n    progress: progressPercentage(total, processed),\n  };\n}\n\nexport function extensionCampaignCounters(payload = {}, current = {}) {\n  const summary = payload.finalSummary || {};\n  const total = payload.total ?? payload.progress?.total ?? summary.total ?? current.totalRecipients;\n  const confirmedSent = payload.confirmedSent ?? summary.confirmedSent ?? current.confirmedSentCount;\n  const unverifiedSent = payload.unverifiedSent ?? summary.unverifiedSent ?? current.unverifiedSentCount;\n  const derivedSent = (confirmedSent != null || unverifiedSent != null)\n    ? Number(confirmedSent || 0) + Number(unverifiedSent || 0)\n    : undefined;\n  return safeCampaignCounters(\n    total,\n    payload.sent ?? summary.sent ?? derivedSent ?? current.sentCount,\n    payload.failed ?? summary.failed ?? current.errorCount,\n    confirmedSent,\n    unverifiedSent,\n  );\n}\n'''
          repl(p,old,new)

          p='src/gestion/marketing/whatsapp/campaignService.js'
          repl(p,'''      sentCount: 0,\n      errorCount: 0,\n      processedCount: 0,''','''      sentCount: 0,\n      confirmedSentCount: 0,\n      unverifiedSentCount: 0,\n      errorCount: 0,\n      processedCount: 0,''')
          repl(p,'''      sentCount: counters.sent,\n      errorCount: counters.errors,\n      processedCount: counters.processed,''','''      sentCount: counters.sent,\n      confirmedSentCount: counters.confirmedSent,\n      unverifiedSentCount: counters.unverifiedSent,\n      errorCount: counters.errors,\n      processedCount: counters.processed,''')
          repl(p,'''      extensionVersion: String(message.payload?.extensionVersion || current.extensionVersion || ""),\n      updatedAt: serverTimestamp(),''','''      extensionVersion: String(message.payload?.extensionVersion || current.extensionVersion || ""),\n      ...(status === "completed" && message.payload?.finalSummary ? { extensionFinalSummary: message.payload.finalSummary } : {}),\n      updatedAt: serverTimestamp(),''')
          repl(p,'''        sentCount: counters.sent,\n        errorCount: counters.errors,\n        processedCount: counters.processed,''','''        sentCount: counters.sent,\n        confirmedSentCount: counters.confirmedSent,\n        unverifiedSentCount: counters.unverifiedSent,\n        errorCount: counters.errors,\n        processedCount: counters.processed,''')
          repl(p,'''        `Procesados: ${counters.processed}/${counters.total} · enviados: ${counters.sent} · con problemas: ${counters.errors}.`,''','''        `Procesados: ${counters.processed}/${counters.total} · confirmados: ${counters.confirmedSent} · sin confirmación: ${counters.unverifiedSent} · con problemas: ${counters.errors}.`,''')

          p='src/gestion/pages/WhatsAppCampaignsPage.jsx'
          repl(p,'''  pingWhatsAppExtension,\n  prepareCampaignForExtension,''','''  extensionConnectionState,\n  pingWhatsAppExtension,\n  prepareCampaignForExtension,''')
          repl(p,'''          connectionState: message.payload.operational === true ? "connected" : message.payload.errorCode === "EXTENSION_CONTEXT_INVALIDATED" ? "needs_page_reload" : "disconnected",''','''          connectionState: extensionConnectionState({\n            operational: message.payload.operational === true,\n            errorCode: message.payload.errorCode || "",\n            runtimeAvailable: message.payload.runtimeAvailable !== false,\n            responded: true,\n          }),''')
          old='safeCampaignCounters(campaign.totalRecipients, campaign.sentCount, campaign.errorCount)'
          new='safeCampaignCounters(campaign.totalRecipients, campaign.sentCount, campaign.errorCount, campaign.confirmedSentCount, campaign.unverifiedSentCount)'
          s=read(p)
          if s.count(old)<3: raise SystemExit(f'expected >=3 counters occurrences, got {s.count(old)}')
          s=s.replace(old,new)
          s=s.replace('''<span>{campaign.processedCount ?? counters.processed} / {counters.total} procesados · {counters.sent} enviados</span>''','''<span>{campaign.processedCount ?? counters.processed} / {counters.total} procesados · {counters.confirmedSent} confirmados{counters.unverifiedSent ? ` · ${counters.unverifiedSent} sin confirmación` : ""}</span>''')
          s=s.replace('''<span>{counters.sent} enviados · {counters.errors} con problemas · {campaign.progressPercentage ?? counters.progress}% procesado</span>''','''<span>{counters.confirmedSent} confirmados{counters.unverifiedSent ? ` · ${counters.unverifiedSent} sin confirmación` : ""} · {counters.errors} con problemas · {campaign.progressPercentage ?? counters.progress}% procesado</span>''')
          s=s.replace('''    {campaign.status === "completed" && counters.errors > 0 ? <Toast tone="info">Campaña completada · {counters.sent} enviados · {counters.errors} con problemas.</Toast> : null}''','''    {campaign.status === "completed" && counters.unverifiedSent > 0 ? <Toast tone="info">Campaña completada · {counters.unverifiedSent} envío(s) fueron ejecutados pero no pudieron confirmarse en la interfaz.</Toast> : null}\n    {campaign.status === "completed" && counters.unverifiedSent === 0 && counters.errors > 0 ? <Toast tone="info">Campaña completada · {counters.sent} enviados · {counters.errors} con problemas.</Toast> : null}''')
          s=s.replace('''<div><dt>Enviados</dt><dd>{counters.sent}</dd></div><div><dt>Problemas</dt>''','''<div><dt>Enviados</dt><dd>{counters.sent}</dd></div><div><dt>Confirmados</dt><dd>{counters.confirmedSent}</dd></div><div><dt>Sin confirmación</dt><dd>{counters.unverifiedSent}</dd></div><div><dt>Problemas</dt>''')
          write(p,s)

          # Domain tests: update expected shape and cover confirmed/unverified split.
          p='tests/whatsapp-campaign-domain.test.mjs'
          s=read(p)
          s=s.replace('{ total: 100, sent: 97, errors: 3, failed: 3, processed: 100, remaining: 0, progress: 100 }', '{ total: 100, sent: 97, confirmedSent: 97, unverifiedSent: 0, errors: 3, failed: 3, processed: 100, remaining: 0, progress: 100 }')
          marker='''test("progreso de la extensión usa sent y failed separados", () => {'''
          idx=s.index(marker)
          extra='''test("contadores separan envíos confirmados de enviados sin confirmación", () => {\n  assert.deepEqual(\n    safeCampaignCounters(100, 100, 0, 98, 2),\n    { total: 100, sent: 100, confirmedSent: 98, unverifiedSent: 2, errors: 0, failed: 0, processed: 100, remaining: 0, progress: 100 },\n  );\n  assert.deepEqual(\n    extensionCampaignCounters({ total: 100, sent: 100, confirmedSent: 98, unverifiedSent: 2, failed: 0 }, {}),\n    { total: 100, sent: 100, confirmedSent: 98, unverifiedSent: 2, errors: 0, failed: 0, processed: 100, remaining: 0, progress: 100 },\n  );\n});\n\n'''
          s=s[:idx]+extra+s[idx:]
          write(p,s)

          p='tests/whatsapp-marketing-integration.test.mjs'
          s=read(p)
          append='''\ntest("0.9.4.3 persiste y muestra confirmados vs enviados sin confirmación", async () => {\n  const [service, page, domain] = await Promise.all([\n    read("src/gestion/marketing/whatsapp/campaignService.js"),\n    read("src/gestion/pages/WhatsAppCampaignsPage.jsx"),\n    read("src/gestion/marketing/whatsapp/campaignDomain.js"),\n  ]);\n  assert.match(service, /confirmedSentCount/);\n  assert.match(service, /unverifiedSentCount/);\n  assert.match(service, /extensionFinalSummary/);\n  assert.match(domain, /confirmedSent/);\n  assert.match(domain, /unverifiedSent/);\n  assert.match(page, /Sin confirmación/);\n  assert.match(page, /extensionConnectionState/);\n});\n'''
          write(p,s+append)
          PY
            npm ci
            npm test
            npm run test:rules
            npm run build
          } 2>&1 | tee /tmp/p0-app.log
      - name: Commit Web App integration
        if: steps.work.outcome == 'success'
        shell: bash
        run: |
          git rm .github/workflows/p0-0943-app.yml .p0-app-trigger 2>/dev/null || true
          git rm -f .p0-0943-app-debug.txt 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: show confirmed and unverified WhatsApp sends"
          git push origin agent/rendimiento-vendedor-clientes
      - name: Publish failure diagnostics only
        if: steps.work.outcome != 'success'
        shell: bash
        run: |
          git reset --hard HEAD
          tail -n 240 /tmp/p0-app.log > .p0-0943-app-debug.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .p0-0943-app-debug.txt
          git commit -m "chore: capture WhatsApp 0.9.4.3 Web App failure"
          git push origin agent/rendimiento-vendedor-clientes
          exit 1
