name: Stage 4 planner integration

on:
  push:
    branches: ["feature/meta-ads-campaign-planner"]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[stage4-integrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/meta-ads-campaign-planner
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply Stage 4 integration
        run: python scripts/apply-stage4-planner.py
      - run: npm ci
      - run: npm test
      - run: npx firebase-tools@14.12.0 emulators:exec --only firestore --project demo-flor-mia-stage4 "npm run test:rules"
      - run: npm run build
      - name: Remove temporary integration helpers
        run: |
          rm -f scripts/apply-stage4-planner.py
          rm -f .github/workflows/stage4-integrate-planner.yml
      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat(meta-ads): integrate campaign planner permissions rules and UI [stage4-integrated]"
            git push origin HEAD:feature/meta-ads-campaign-planner
          fi
