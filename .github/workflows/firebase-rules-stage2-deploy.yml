name: Deploy Firestore Rules — Meta Ads Stage 2

on:
  push:
    branches: [feature/meta-ads-foundations]

permissions:
  contents: read

jobs:
  validate-and-deploy-rules:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: app-integral-fm
      SA_APP_INTEGRAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_APP_INTEGRAL_FM }}
      SA_GENERIC: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDENTIALS }}
      GCLOUD_SERVICE_KEY: ${{ secrets.GCLOUD_SERVICE_KEY }}
      FIREBASE_TOKEN_SECRET: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify authorized Firebase target
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const rc = JSON.parse(fs.readFileSync('.firebaserc', 'utf8'));
          if (rc?.projects?.default !== 'app-integral-fm') {
            console.error(`Refusing deploy: .firebaserc default is ${rc?.projects?.default || '<missing>'}`);
            process.exit(1);
          }
          if (JSON.stringify(rc).includes('fm-stock-y-venta')) {
            console.error('Refusing deploy: legacy project appears in .firebaserc');
            process.exit(1);
          }
          console.log('Authorized Firebase target confirmed: app-integral-fm');
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Run application tests before deploy
        run: npm test

      - name: Run Firestore Rules Emulator before deploy
        run: npx firebase-tools@14.12.0 emulators:exec --only firestore --project demo-flor-mia-integral "npm run test:rules"

      - name: Build before deploy
        run: npm run build

      - name: Configure Firebase deployment credentials
        id: firebase-auth
        shell: bash
        run: |
          set -euo pipefail
          write_json_secret() {
            local raw="$1"
            local target="$RUNNER_TEMP/firebase-service-account.json"
            printf '%s' "$raw" > "$target"
            if node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$target" >/dev/null 2>&1; then
              chmod 600 "$target"
              echo "GOOGLE_APPLICATION_CREDENTIALS=$target" >> "$GITHUB_ENV"
              echo "auth_mode=service_account" >> "$GITHUB_OUTPUT"
              return 0
            fi
            if printf '%s' "$raw" | base64 --decode > "$target" 2>/dev/null && node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$target" >/dev/null 2>&1; then
              chmod 600 "$target"
              echo "GOOGLE_APPLICATION_CREDENTIALS=$target" >> "$GITHUB_ENV"
              echo "auth_mode=service_account" >> "$GITHUB_OUTPUT"
              return 0
            fi
            rm -f "$target"
            return 1
          }

          if [ -n "${SA_APP_INTEGRAL:-}" ] && write_json_secret "$SA_APP_INTEGRAL"; then
            echo "Using repository service-account credential for app-integral-fm."
          elif [ -n "${SA_GENERIC:-}" ] && write_json_secret "$SA_GENERIC"; then
            echo "Using repository Firebase service-account credential."
          elif [ -n "${GOOGLE_CREDS_JSON:-}" ] && write_json_secret "$GOOGLE_CREDS_JSON"; then
            echo "Using repository Google credential."
          elif [ -n "${GCLOUD_SERVICE_KEY:-}" ] && write_json_secret "$GCLOUD_SERVICE_KEY"; then
            echo "Using repository Google Cloud service key."
          elif [ -n "${FIREBASE_TOKEN_SECRET:-}" ]; then
            echo "auth_mode=firebase_token" >> "$GITHUB_OUTPUT"
            echo "Using repository Firebase CLI token."
          else
            echo "No supported Firebase deployment credential is configured in GitHub Secrets." >&2
            exit 78
          fi

      - name: Deploy Firestore Rules to app-integral-fm
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.firebase-auth.outputs.auth_mode }}" = "firebase_token" ]; then
            npx firebase-tools@14.12.0 deploy --only firestore:rules --project app-integral-fm --non-interactive --token "$FIREBASE_TOKEN_SECRET"
          else
            npx firebase-tools@14.12.0 deploy --only firestore:rules --project app-integral-fm --non-interactive
          fi

      - name: Re-run Firestore Rules Emulator after deploy
        run: npx firebase-tools@14.12.0 emulators:exec --only firestore --project demo-flor-mia-integral "npm run test:rules"

      - name: Re-run application tests after deploy
        run: npm test
