name: ARCA homologación

on:
  push:
    branches:
      - feature/arca-integration
  pull_request:
    paths:
      - "netlify/functions/_lib/arca/**"
      - "netlify/functions/arca-*.mjs"
      - "src/gestion/services/arcaService.js"
      - "src/gestion/fiscal/**"
      - "src/shared/fiscal/**"
      - "src/gestion/pages/SettingsPage.jsx"
      - "src/gestion/pages/QuickSalesPage.jsx"
      - "src/gestion/services/sellerService.js"
      - "tests/arca*.test.mjs"
      - "tests/firestore.rules.mjs"
      - "firestore.rules"
      - ".env.example"
      - ".github/workflows/arca-ci.yml"

jobs:
  arca-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Tests ARCA
        run: npm run test:arca
      - name: Reglas Firestore fiscales
        run: npm run test:rules:fiscal
      - name: Reglas comerciales y regresiones de stock
        run: npm run test:rules:core
      - name: Build
        run: npm run build
