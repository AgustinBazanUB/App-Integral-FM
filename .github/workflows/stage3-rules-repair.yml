name: Stage 3 rules repair
on:
  push:
    branches:
      - feature/meta-ads-theory-engine
permissions:
  contents: write
jobs:
  repair-test:
    if: contains(github.event.head_commit.message, '[stage3-rules-repair]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/meta-ads-theory-engine
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply Firestore-safe Theory Rules
        run: python scripts/simplify-stage3-rules.py
      - run: npm ci
      - run: npm test
      - run: npx firebase-tools@14.12.0 emulators:exec --only firestore --project demo-flor-mia-stage3 "npm run test:rules"
      - run: npm run build
      - name: Remove temporary verification files
        run: |
          rm scripts/simplify-stage3-rules.py
          rm .github/workflows/stage3-rules-repair.yml
          rm .github/workflows/stage3-verify.yml
      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(meta-ads): keep Theory Rules within Firestore limits"
          git push origin HEAD:feature/meta-ads-theory-engine
