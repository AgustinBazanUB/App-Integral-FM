name: Verificación main

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: main-verification
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Tests de aplicación
        run: npm test
      - name: Reglas Firestore
        run: npx firebase-tools@14.12.0 emulators:exec --only firestore --project demo-flor-mia-integral "npm run test:rules"
      - name: Build de producción
        run: npm run build
