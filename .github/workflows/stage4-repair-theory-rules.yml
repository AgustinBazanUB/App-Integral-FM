name: Stage 4 inherited Rules repair

on:
  push:
    branches: ["feature/meta-ads-campaign-planner"]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[stage4-repair-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/meta-ads-campaign-planner
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Repair inherited Theory Rules
        run: python scripts/stage4-repair-theory-rules.py
      - run: npm ci
      - run: npm test
      - run: npx firebase-tools@14.12.0 emulators:exec --only firestore --project demo-flor-mia-stage4-repair "npm run test:rules"
      - run: npm run build
      - name: Remove repair helpers
        run: |
          rm -f scripts/stage4-repair-theory-rules.py
          rm -f .github/workflows/stage4-repair-theory-rules.yml
          rm -f .github/workflows/stage4-baseline.yml
          rm -f .github/workflows/stage3-rules-repair.yml
          rm -f .github/workflows/stage3-verify.yml
          rm -f scripts/simplify-stage3-rules.py
      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix(meta-ads): keep theory rules within Firestore budget [stage4-repair-done]"
            git push origin HEAD:feature/meta-ads-campaign-planner
          fi
