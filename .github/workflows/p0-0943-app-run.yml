name: rerun-whatsapp-0.9.4.3-web-app

on:
  push:
    branches: [agent/rendimiento-vendedor-clientes]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Apply and verify using project CI commands
        id: work
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/p0-app.log
          {
            python3 - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/p0-0943-app.yml').read_text()
          anchor=source.index('      - name: Apply 0.9.4.3 Web App integration')
          start=source.index("            python3 - <<'PY'\n", anchor)+len("            python3 - <<'PY'\n")
          end=source.index('\n          PY', start)
          block=source[start:end]
          lines=[line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          Path('/tmp/apply-app.py').write_text('\n'.join(lines)+'\n')
          PY
            python3 /tmp/apply-app.py
            npm ci
            npm test
            npx firebase-tools@14.12.0 emulators:exec --only firestore --project demo-flor-mia-integral "npm run test:rules"
            npm run build
          } 2>&1 | tee /tmp/p0-app.log
      - name: Commit Web App integration
        if: steps.work.outcome == 'success'
        shell: bash
        run: |
          git rm .github/workflows/p0-0943-app.yml .github/workflows/p0-0943-app-run.yml
          git rm -f .p0-app-trigger .p0-app-trigger-2 .p0-0943-app-debug.txt 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: show confirmed and unverified WhatsApp sends"
          git push origin agent/rendimiento-vendedor-clientes
      - name: Publish failure diagnostics only
        if: steps.work.outcome != 'success'
        shell: bash
        run: |
          git reset --hard HEAD
          tail -n 260 /tmp/p0-app.log > .p0-0943-app-debug.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .p0-0943-app-debug.txt
          git commit -m "chore: capture WhatsApp 0.9.4.3 Web App failure"
          git push origin agent/rendimiento-vendedor-clientes
          exit 1
